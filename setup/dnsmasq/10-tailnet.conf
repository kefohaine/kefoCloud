# Tailscale split-DNS resolver. Bind only to the Tailscale IP so
# the VPS is not an open resolver on the public internet.
listen-address=100.81.245.77
bind-interfaces

# Override the Tailscale-only hostname locally. Other *.jehpok.com
# names (www/app/api/cloud) are public and fall through to upstream.
address=/vps.jehpok.com/100.81.245.77

# Upstream forwarders (sequential, matching the former Corefile).
strict-order
server=1.1.1.1
server=1.0.0.1
server=9.9.9.9

# No DHCP, no TFTP, no resolv.conf hijacking.
no-dhcp-interface=tailscale0
no-resolv

# Logging disabled — query/reply chatter drowned the journal.
# Re-enable with `log-queries` if debugging DNS.