<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>files.jehpok.com</title>
<style>
  :root { color-scheme: light dark; }
  body {
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    margin: 0; padding: 2rem 1rem; max-width: 820px; margin-inline: auto;
  }
  header h1 { font-size: 1.4rem; margin: 0 0 .25rem; }
  header p  { color: #666; margin: 0 0 1.5rem; font-size: .9rem; }
  ul { list-style: none; padding: 0; margin: 0; }
  li {
    display: flex; gap: .75rem; align-items: baseline;
    padding: .35rem 0; border-bottom: 1px solid #eee;
  }
  li a { color: #0366d6; text-decoration: none; word-break: break-all; }
  li a:hover { text-decoration: underline; }
  li .size { color: #888; font-variant-numeric: tabular-nums; font-size: .85rem; white-space: nowrap; }
  li .date { color: #aaa; font-variant-numeric: tabular-nums; font-size: .85rem; white-space: nowrap; margin-left: auto; }
  footer { margin-top: 2rem; color: #999; font-size: .8rem; }
</style>
</head>
<body>
<header>
  <h1>files.jehpok.com</h1>
  <p>Public workshop — files, tools, and apps published by the operator.</p>
</header>
<main id="list">Loading…</main>
<footer>Served from the jehpok.com VPS. Items here are public.</footer>

<script>
function fmtSize(n) {
  if (n == null) return '—';
  if (n < 1024) return n + ' B';
  if (n < 1048576) return (n/1024).toFixed(1) + ' KB';
  if (n < 1073741824) return (n/1048576).toFixed(1) + ' MB';
  return (n/1073741824).toFixed(1) + ' GB';
}
function fmtDate(s) {
  if (!s) return '';
  const d = new Date(s);
  if (isNaN(d)) return '';
  return d.toISOString().slice(0, 10);
}
// Walk the directory listing served by Caddy's file_server browse.
async function build() {
  const root = window.location.pathname.replace(/\/+$/, '');
  let html = '';
  try {
    const res = await fetch(root + '/', { headers: { 'Accept': 'application/json' } });
    if (!res.ok) throw new Error(res.status);
    const data = await res.json();
    const items = (data.items || []).slice().sort((a, b) =>
      (b.isDir ? 1 : 0) - (a.isDir ? 1 : 0) ||
      a.name.localeCompare(b.name, undefined, { numeric: true }));
    if (root !== '') {
      html += `<li><a href="${root.split('/').slice(0, -1).join('/') || '/'}">../</a></li>`;
    }
    if (!items.length) {
      html = '<p style="color:#888">Empty — drop files into <code>content/domain/files/</code> and they will appear here.</p>';
    } else {
      for (const it of items) {
        const href = root + '/' + encodeURIComponent(it.name) + (it.isDir ? '/' : '');
        const cls  = it.isDir ? 'dir' : 'file';
        const icon = it.isDir ? '📁' : '📄';
        html += `<li><span aria-hidden="true">${icon}</span><a class="${cls}" href="${href}">${it.name}${it.isDir ? '/' : ''}</a><span class="size">${fmtSize(it.size)}</span><span class="date">${fmtDate(it.modTime)}</span></li>`;
      }
    }
  } catch (e) {
    html = `<p style="color:#c00">Could not load listing (${e}). Browse the raw directory <a href="${root || '/'}/">here</a>.</p>`;
  }
  document.getElementById('list').innerHTML = '<ul>' + html + '</ul>';
}
build();
</script>
</body>
</html>
