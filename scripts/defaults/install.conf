# install.sh prompt defaults — edit these instead of typing at install time.
# Syntax: 'install <key> <value>' — domain, or '<module> module = true|false'.
# Modules: cloud (Nextcloud + Talk), vault, mail, games (PufferPanel/MC),
#          monitor (Uptime Kuma). Default: everything installed.
install domain = fxmq.net
install cloud module = true
install vault module = true
install mail module = true
install games module = true
install monitor module = true
