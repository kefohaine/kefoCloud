# uninstall.sh prompt defaults — edit these instead of typing at uninstall time.
# Syntax mirrors install.conf. Everything defaults OFF (safe): a bare Enter
# never uninstalls anything; 'true' opts IN to removal.
# Keys: '<module> module' (cloud/vault/mail/games/monitor), host, edge,
#       pkgs, user, tailnet, data (module data dirs).
uninstall cloud module = false
uninstall vault module = false
uninstall mail module = false
uninstall games module = false
uninstall monitor module = false
uninstall host = false
uninstall edge = false
uninstall pkgs = false
uninstall user = false
uninstall tailnet = false
uninstall data = false