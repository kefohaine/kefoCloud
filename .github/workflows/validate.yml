# Read-only validation on every branch push (except main, whose commits arrive
# through a pull request already validated here) and every pull request: shell
# syntax, the config audit (YAML parses, every token declared, no operator value
# in a tracked file), the prose gate, the commit-hygiene audit and the
# pull-request shape (a tree equal to main, or a rename over a path main
# changed). It never writes, merges or pushes.

name: validate

on:
  push:
    branches-ignore:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Shell syntax
        run: |
          status=0
          while IFS= read -r script; do
            bash -n "$script" || status=1
          done < <(git ls-files '*.sh')
          exit "$status"

      - name: Config audit
        run: bash scripts/info/config-audit.sh

      - name: Prose gate
        run: bash scripts/info/prose-audit.sh

      - name: Commit hygiene
        run: |
          bash scripts/info/git-audit.sh origin/main..HEAD

      - name: Pull-request shape
        env:
          TIP: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          bash scripts/info/pr-guard.sh "origin/main..$TIP"
