# Read-only validation on every branch push and every pull request: shell
# syntax, the prose gate and the commit-hygiene audit. It never writes, merges
# or pushes.

name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Shell syntax
        run: |
          status=0
          while IFS= read -r script; do
            bash -n "$script" || status=1
          done < <(git ls-files '*.sh')
          exit "$status"

      - name: Prose gate
        run: bash scripts/info/prose-audit.sh

      - name: Commit hygiene
        run: |
          # A range that only touches documentation needs no revert recipe:
          # rule 10 counts non-doc files, and a docs-only pull request has none.
          range="origin/main..HEAD"
          docs_only=1
          while IFS= read -r p; do
            [ -z "$p" ] && continue
            case "$p" in docs/*|*.md) ;; *) docs_only=0 ;; esac
          done < <(git diff --name-only "$range")
          if [ "$docs_only" = 1 ]; then
            bash scripts/info/git-audit.sh "$range" --docs-only
          else
            bash scripts/info/git-audit.sh "$range"
          fi
