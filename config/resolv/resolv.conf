# /etc/resolv.conf — every name resolves through Tailscale.
#
# Why this file is tracked: this host is the tailnet's DNS server. dnsmasq
# answers the split-DNS names for {{DOMAIN}} (ttyd.{{DOMAIN}},
# vault.{{DOMAIN}}, mail.{{DOMAIN}} — doors that have NO public record because
# they are tailnet-only), and it
# only listens on this node's Tailscale address (see
# config/dnsmasq/10-tailnet.conf). Tailscale's own resolver, 100.100.100.100,
# is what applies the split-DNS route to THIS machine and forwards everything
# else upstream.
#
# The provider rewrote this file once (2026-10-28: the DHCP-supplied resolvers
# of the hosting network) and the symptom was exactly "vault.{{DOMAIN}} does not
# resolve on the tailnet": public names kept working, so nothing else broke,
# while the tailnet-only door answered NXDOMAIN to the machine that hosts it.
# 1.1.1.1 stays as the second entry so a tailscaled outage cannot take DNS
# down with it.
nameserver 100.100.100.100
nameserver 1.1.1.1
options edns0 trust-ad
