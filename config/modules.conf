# config/modules.conf — the ONE place a module is declared.
#
# A module is a composable unit of the stack (its own compose file under
# modules/<dir>/, its own vhost, its own data). This file maps the *module
# name* (the word the installer, `make fetch`, `make smoke` and the docs use)
# to its directory, its public host label and its containers. Scripts read it
# via scripts/lib/modules.sh — add, rename or remove a module here and every
# tool (fetch, fetch-more, smoke, the installer's module list) follows.
#
# TWO ORTHOGONAL FACTS — never conflate them:
#   * module state   — `installed` or `not installed`. Read from
#                      data/installed-modules.conf (written by install.sh).
#                      A module that is not installed is simply ABSENT: no
#                      container, no data, no route. It is NOT "tailnet-only".
#   * route exposure — for a host that does exist: `public` (Cloudflare →
#                      this box) or `tailnet-only` (resolvable and reachable
#                      only inside the tailnet, e.g. tail.$DOMAIN). Exposure
#                      describes a *route*, never a missing module.
#
# columns: <module> <dir> <host-label> <containers...>
# host-label is the public subdomain (<label>.$DOMAIN) or '-' for a module with
# no public vhost (its traffic is not HTTP).
cloud   nextcloud    cloud   nextcloud postgresql redis talk-hpb talk-relay
vault   vaultwarden  vault   vaultwarden
mail    mailserver   mail    mailserver roundcube
monitor uptimekuma   kuma    uptimekuma
