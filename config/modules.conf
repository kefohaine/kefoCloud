# config/modules.conf — the ONE place a module is declared.
#
# A module is a composable unit of the stack (its own compose file under
# modules/<dir>/, its own vhost, its own data). This file maps the *module
# name* (the word the installer, `make fetch`, `make smoke` and the docs use)
# to its directory, its public host label and its containers. Scripts read it
# via scripts/lib/modules.sh — add, rename or remove a module here and every
# tool (fetch, fetch-more, smoke, the installer's module list) follows.
#
# TWO ORTHOGONAL FACTS — never conflate them:
#   * module state   — `installed` or `not installed`. Read from the
#                      `enabled_modules` field of data/wizard.state MINUS the
#                      modules recorded in data/uninstalled-modules.conf, the
#                      hand-off a script that removed a module writes (the
#                      installer remains wizard.state's sole writer;
#                      scripts/lib/modules.sh is the one reader). A module that
#                      is not installed is simply ABSENT: no container, no data,
#                      no route. It is NOT "tailnet-vpn".
#   * route exposure — for a host that does exist: `cloudflare-dns` (a public
#                      A record, no gate) or `tailnet-vpn` (no public record,
#                      answered by this machine's dnsmasq, the vhost 403s every
#                      other source). Chosen per vhost at install time and
#                      recorded in data/instance.conf (scripts/lib/exposure.sh).
#                      Exposure describes a *route*, never a missing module.
#
# columns: <module> <dir> <host-label> <containers...>
# host-label is the subdomain (<label>.$DOMAIN) or '-' for a module with no
# vhost of its own (its routes live under another vhost).
