# Matrix login failures: MAS answers a bad password with 400 (OAuth2
# invalid_grant), not 401, so this filter keys on 400 as well as the usual
# 401/403/429. One file per vhost (matrix.log for the compat login, matrix-auth.log
# for the OAuth2 flow), so a ban is scoped to the endpoint that saw it.
[Definition]

# Field order: remote_ip and uri inside "request", status after it.
failregex = ^\{"level":"info".*"remote_ip":"<HOST>".*"uri":"[^"]*(?:login|logout|session|oauth2|token|register|auth)[^"]*".*"status":(?:400|401|403|429)

ignoreregex =

[Init]
