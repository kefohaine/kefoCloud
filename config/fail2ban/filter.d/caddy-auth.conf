# Web-login failures as Caddy records them (JSON access log, one file per app:
# $DATA_DIR/logs/caddy/<app>.log). The jail that uses this filter points logpath at
# ONE app's file, so a ban is scoped to that app's login endpoint.
#
# Matched: an auth rejection (401/403) or a rate-limit trip (429). Field order
# in the JSON is not stable, so each pattern keys on the status plus the
# request URI, never on a fixed position.
[Definition]

# Field order in a Caddy access line: remote_ip and uri are inside "request",
# status is top-level AFTER it — match in that order, not status-first.
failregex = ^\{"level":"info".*"remote_ip":"<HOST>".*"uri":"[^"]*(?:login|signin|sign-in|session|identity/connect/token|auth)[^"]*".*"status":(?:401|403|429)

ignoreregex =

[Init]
