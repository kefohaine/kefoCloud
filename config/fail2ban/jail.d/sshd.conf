[sshd]
enabled = true
port = ssh
maxretry = 5
bantime = 1h
ignoreip = 127.0.0.1/8 ::1 100.64.0.0/10
# Debian trixie has no /var/log/auth.log (journald only): the default file
# backend would fail with "Have not found any log file for sshd jail" and the
# whole service exits. Read sshd events from the journal instead.
backend = systemd
# Only the tailnet may reach 22, but keep the jail strict if that changes.
banaction = ufw
