[roundcube-login]
enabled = true
# One Caddy access log per app (modules/caddy/vhosts/*.caddy writes it), so this
# jail sees only roundcube's requests. ufw drops the offender's source address.
filter = caddy-auth
logpath = {{DATA_DIR}}/logs/caddy/roundcube.log
maxretry = 10
findtime = 10m
bantime = 1h
ignoreip = 127.0.0.1/8 ::1 100.64.0.0/10
# tailnet peers' public endpoints are whitelisted live by scripts/ops/fail2ban-tailnet-ignore.sh (NAT: the ban sees the router address, not the device)
ignorecommand = {{REPO_DIR}}/scripts/ops/fail2ban-tailnet-ignore.sh <ip>
banaction = ufw
