[vault-login]
enabled = true
# One Caddy access log per app (modules/caddy/vhosts/*.caddy writes it), so this
# jail sees only vault's requests. ufw drops the offender's source address.
filter = caddy-auth
logpath = /var/log/caddy/vault.log
maxretry = 10
findtime = 10m
bantime = 1h
ignoreip = 127.0.0.1/8 ::1 100.64.0.0/10
banaction = ufw
