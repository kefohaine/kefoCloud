services:
  cloud:
    image: nextcloud:latest
    container_name: cloud
    restart: unless-stopped

    # No published ports — only Caddy (on the 'net' bridge) reaches this container.
    # If you ever need to debug from the host: `docker exec -it cloud bash`.
    expose:
      - "80"

    volumes:
      # Host bind mount keeps data visible at /var/www/github/jehpok.com/cloud/data
      # so backups and rsync see it as a normal directory.
      # chown -R 33:33 /var/www/github/jehpok.com/cloud/data BEFORE first start.
      - /var/www/github/jehpok.com/cloud/data:/var/www/html:rw

    environment:
      # With no MYSQL_/POSTGRES_ vars set, the official image's entrypoint
      # auto-creates db/owncloud.db (SQLite) inside the data volume.
      NEXTCLOUD_ADMIN_USER: ${NEXTCLOUD_ADMIN_USER}
      NEXTCLOUD_ADMIN_PASSWORD: ${NEXTCLOUD_ADMIN_PASSWORD}
      NEXTCLOUD_OVERWRITEPROTOCOL: https
      NEXTCLOUD_TRUSTED_DOMAINS: "cloud.jehpok.com"
      APACHE_PORT: 80

    networks:
      - net

networks:
  net:
    external: true