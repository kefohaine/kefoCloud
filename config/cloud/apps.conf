# config/cloud/apps.conf — operator-chosen Nextcloud app actions (tracked,
# shipped with sane defaults; edit to change the desired app set).
# One action per line, in order. Valid verbs: install&enable=, disable=, remove=.
# Multi-action form allowed:  install&enable=spreed disable=app_api
# Unknown app ids: install&enable on a not-installed app warns, prompts for your
# choice (proceed / drop / resolve), and aborts only if you do not confirm;
# disable= / remove= on a not-installed app is a harmless no-op (skipped).
# The same app with two different verbs warns, prompts (proceed / drop / resolve)
# and aborts the install only if you do not confirm. Satisfied actions are
# skipped silently for idempotent, unattended re-runs (idempotent runs never prompt).
#
# shipped defaults (Nextcloud image already contains spreed):
install&enable=spreed
# AppAPI is not used on this host — keep it disabled:
disable=app_api
