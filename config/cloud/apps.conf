# config/cloud/apps.conf — operator-chosen Nextcloud app actions (tracked,
# shipped with sane defaults; edit to change the desired app set).
# One action per line, in order. Valid verbs: install&enable=, disable=, remove=.
# Multi-action form allowed:  install&enable=spreed disable=app_api
# Unknown app ids, or the same app with two different verbs → fatal: the
# installer warns with details, prompts for your choice (proceed / drop / resolve)
# and aborts only if you do not confirm. Nothing is skipped silently unless the
# action is already satisfied by the live instance (idempotent, unattended runs).
#
# shipped defaults (Nextcloud image already contains spreed):
install&enable=spreed
# AppAPI is not used on this host — keep it disabled:
disable=app_api
