# Host kernel tuning for homelab.com.
#
# Dropped swappiness from the Debian default (60) to 10. With only 3.7 GB
# of RAM total, the default would happily swap out active processes (Java,
# Claude) to make room for file cache. At 10 the kernel prefers to evict
# clean file pages instead — better for an interactive workload where
# game/IDE latency matters more than bulk file throughput.
#
# Dirty ratios reduced so writeback happens more often, in shorter bursts.
# The default 20% means up to ~740 MB of dirty pages can accumulate before
# the kernel starts writeback; on a slow VPS disk that's a 5+ second stall
# on the next sync. 10/5 keeps the working set small.
#
# Applied by `make setup` via `sysctl --system` (or `sysctl -p` on this
# single file). Survives reboot via the systemd-sysctl service reading
# /etc/sysctl.d/*.conf.

vm.swappiness = 10
vm.dirty_ratio = 10
vm.dirty_background_ratio = 5

# TCP — small bump to the TIME-WAIT socket bucket. Default 262144 is fine
# for our traffic level; commented out to keep the diff minimal. If we
# ever hit a "time-wait bucket overflow" warning in dmesg, uncomment:
# net.ipv4.tcp_max_tw_buckets = 524288
