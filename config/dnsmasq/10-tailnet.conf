# Tailscale split-DNS resolver. Bind only to the Tailscale IP so this host is
# not an open resolver on the public internet.
#
# 100.64.0.1 is a PLACEHOLDER, not this host's address: the deploy step
# (`make install-config` / `make install-dnsmasq-conf`) rewrites it to the live
# Tailscale IPv4. Copying this file verbatim to
# /etc/dnsmasq.d/ makes dnsmasq fail-loop on "Cannot assign requested address"
# and takes tailnet DNS (and with it ttyd.$DOMAIN) down.
listen-address=100.64.0.1
bind-interfaces

# Override the tailnet-vpn hostnames locally: a name is answered here only when
# its vhost's recorded exposure is `tailnet-vpn` (data/instance.conf, written by
# the installer) — the same answer the vhost's @not_tailnet gate renders from,
# so the address and the gate can never disagree. Every cloudflare-dns door
# falls through to upstream.
#
# ttyd is the one FIXED tailnet-vpn door (an unauthenticated root shell), so its
# answer is literal and does not depend on a recorded value.
address=/ttyd.{{DOMAIN}}/100.64.0.1
{{IF VAULT_EXPOSURE=tailnet-vpn}}address=/vault.{{DOMAIN}}/100.64.0.1{{END}}
{{IF ADMIN_MAIL_EXPOSURE=tailnet-vpn}}address=/admin.mail.{{DOMAIN}}/100.64.0.1{{END}}
{{IF ADMIN_MATRIX_EXPOSURE=tailnet-vpn}}address=/admin.matrix.{{DOMAIN}}/100.64.0.1{{END}}
{{IF AUTH_MATRIX_EXPOSURE=tailnet-vpn}}address=/auth.matrix.{{DOMAIN}}/100.64.0.1{{END}}
{{IF BLOG_EXPOSURE=tailnet-vpn}}address=/blog.{{DOMAIN}}/100.64.0.1{{END}}
{{IF CALL_MATRIX_EXPOSURE=tailnet-vpn}}address=/call.matrix.{{DOMAIN}}/100.64.0.1{{END}}
{{IF CHAT_EXPOSURE=tailnet-vpn}}address=/chat.{{DOMAIN}}/100.64.0.1{{END}}
{{IF CLOUD_EXPOSURE=tailnet-vpn}}address=/cloud.{{DOMAIN}}/100.64.0.1{{END}}
{{IF HOME_EXPOSURE=tailnet-vpn}}address=/home.{{DOMAIN}}/100.64.0.1{{END}}
{{IF KUMA_EXPOSURE=tailnet-vpn}}address=/kuma.{{DOMAIN}}/100.64.0.1{{END}}
{{IF LIVEKIT_JWT_MATRIX_EXPOSURE=tailnet-vpn}}address=/livekit-jwt.matrix.{{DOMAIN}}/100.64.0.1{{END}}
{{IF LIVEKIT_MATRIX_EXPOSURE=tailnet-vpn}}address=/livekit.matrix.{{DOMAIN}}/100.64.0.1{{END}}
{{IF MAIL_EXPOSURE=tailnet-vpn}}address=/mail.{{DOMAIN}}/100.64.0.1{{END}}
{{IF MATRIX_EXPOSURE=tailnet-vpn}}address=/matrix.{{DOMAIN}}/100.64.0.1{{END}}
{{IF PHOTOS_EXPOSURE=tailnet-vpn}}address=/photos.{{DOMAIN}}/100.64.0.1{{END}}

# Upstream forwarders (sequential, matching the former Corefile).
strict-order
server=1.1.1.1
server=1.0.0.1
server=9.9.9.9

# No DHCP, no TFTP, no resolv.conf hijacking.
no-dhcp-interface=tailscale0
no-resolv

# Logging disabled — query/reply chatter drowned the journal.
# Re-enable with `log-queries` if debugging DNS.

# Local cache for repeated tailnet queries (dnsmasq default is 150 entries).
cache-size=10000