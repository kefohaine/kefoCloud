# Tailscale split-DNS resolver. Bind only to the Tailscale IP so this host is
# not an open resolver on the public internet.
#
# 100.64.0.1 is a PLACEHOLDER, not this host's address: the deploy step
# (`make install-config` / `make install-dnsmasq-conf`) rewrites it to the live
# Tailscale IPv4, and `make backup` puts it back. Copying this file verbatim to
# /etc/dnsmasq.d/ makes dnsmasq fail-loop on "Cannot assign requested address"
# and takes tailnet DNS (and with it tail.$DOMAIN) down.
listen-address=100.64.0.1
bind-interfaces

# Override the Tailscale-only hostname locally. Other *.{{DOMAIN}}
# names (cloud/vault/kuma) are public and fall through to upstream.
address=/tail.{{DOMAIN}}/100.64.0.1

# Upstream forwarders (sequential, matching the former Corefile).
strict-order
server=1.1.1.1
server=1.0.0.1
server=9.9.9.9

# No DHCP, no TFTP, no resolv.conf hijacking.
no-dhcp-interface=tailscale0
no-resolv

# Logging disabled — query/reply chatter drowned the journal.
# Re-enable with `log-queries` if debugging DNS.

# Local cache for repeated tailnet queries (dnsmasq default is 150 entries).
cache-size=10000