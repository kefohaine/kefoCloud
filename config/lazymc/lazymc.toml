# lazymc config (live copy at /etc/lazymc/lazymc.toml).
# Secret-free: the panel API credentials live in /etc/lazymc/panel-cred (root
# only, never committed). sleep_after is effectively disabled: lazymc's internal
# idle-stop is broken with Paper 26.2 (see docs/GUIDE.md), so the
# mc-idle-sleeper timer owns the 5-minute idle sleep.

[public]
address = "0.0.0.0:25565"
version = "26.2"
protocol = 776

[server]
address = "127.0.0.1:25566"
directory = "/var/www/custom/projects/homelab/puffer/data/servers/2ecfbe8c"
command = "/etc/lazymc/start-panel.sh"

[time]
sleep_after = 86400
minimum_online_time = 120

[motd]
sleeping = "☠ Server is sleeping\n§2☻ Join to start it up"
starting = "§2☻ Server is starting...\n§7⌛ Please wait..."
stopping = "☠ Server going to sleep...\n§7⌛ Please wait..."
from_server = false

[join]
methods = ["hold", "kick"]

[join.hold]
timeout = 25

[join.kick]
starting = "Server is starting... §c♥§r\n\nThis may take some time.\n\nPlease try to reconnect in a minute."
stopping = "Server is going to sleep... §7☠§r\n\nPlease try to reconnect in a minute to wake it again."

[rcon]
enabled = false
port = 25575
randomize_password = true

[advanced]
rewrite_server_properties = true

[config]
version = "0.2.11"
