# Homer dashboard — /home on www.{{DOMAIN}} (rendered into $DATA_DIR/homer/config.yml).
# Homer serves static assets with RELATIVE urls, which is why the vhost proxies
# it under the /home/ prefix (handle + uri strip_prefix) instead of at the root.
title: "kefoCloud"
subtitle: "{{DOMAIN}} — one machine, every door"
logo: "assets/icons/logo.svg"
header: true
footer: false
columns: "3"
connectivityCheck: false
defaults:
  layout: columns
  colorTheme: auto

links:
  - name: "Docs"
    icon: "fas fa-book"
    url: "https://www.{{DOMAIN}}/docs/"
    target: "_self"
  - name: "Welcome"
    icon: "fas fa-bullhorn"
    url: "https://www.{{DOMAIN}}/welcome"
    target: "_self"
  - name: "Terminal"
    icon: "fas fa-terminal"
    url: "https://ttyd.{{DOMAIN}}/"
    target: "_self"

services:
  - name: "Pages"
    icon: "fas fa-compass"
    items:
      - name: "Welcome"
        icon: "fas fa-bullhorn"
        subtitle: "the poster"
        url: "https://www.{{DOMAIN}}/welcome"
        target: "_self"
      - name: "Docs"
        icon: "fas fa-book"
        subtitle: "zensical"
        url: "https://www.{{DOMAIN}}/docs/"
        target: "_self"
      - name: "Blog"
        icon: "fas fa-pen-nib"
        subtitle: "writefreely"
        url: "https://blog.{{DOMAIN}}"
      - name: "Photos"
        icon: "fas fa-images"
        subtitle: "immich"
        url: "https://photos.{{DOMAIN}}"

  - name: "Services"
    icon: "fas fa-server"
    items:
      - name: "Nextcloud"
        icon: "fas fa-cloud"
        subtitle: "cloud"
        url: "https://cloud.{{DOMAIN}}"
      - name: "Vaultwarden"
        icon: "fas fa-key"
        subtitle: "tailnet"
        url: "https://vault.{{DOMAIN}}"
      - name: "Webmail"
        icon: "fas fa-envelope"
        subtitle: "roundcube"
        url: "https://mail.{{DOMAIN}}"
      - name: "Uptime Kuma"
        icon: "fas fa-heart-pulse"
        subtitle: "monitor"
        url: "https://kuma.{{DOMAIN}}"

  - name: "Operations"
    icon: "fas fa-screwdriver-wrench"
    items:
      - name: "Terminal"
        icon: "fas fa-terminal"
        subtitle: "ttyd"
        url: "https://ttyd.{{DOMAIN}}/"
