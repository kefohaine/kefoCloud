services:
  terminal:
    build:
      context: .
      dockerfile: Dockerfile
    image: jehpok/terminal:1
    container_name: terminal
    restart: unless-stopped
    privileged: true

    expose:
      - "7681"

    command:
      - ttyd
      - -W
      # macOS Terminal "Pro" theme — colors from Apple's Terminal.app Pro
      # profile (Settings > Profiles > Pro). Font: Menlo 13pt (macOS
      # Terminal default for Pro). Falls back to Monaco / Courier New on
      # non-mac browsers.
      - -t
      - fontSize=13
      - -t
      - fontFamily=Menlo,Monaco,"Courier New",monospace
      - -t
      - 'theme={"background":"#1e1c1c","foreground":"#d4d4d4","cursor":"#d4d4d4","cursorAccent":"#1e1c1c","selectionBackground":"#1bc9c9","black":"#1e1c1c","red":"#c91b1b","green":"#1bc91b","yellow":"#c91b1b","blue":"#1b1bc9","magenta":"#c91bc9","cyan":"#1bc9c9","white":"#d4d4d4","brightBlack":"#6f6f6f","brightRed":"#ff6f6f","brightGreen":"#6fff6f","brightYellow":"#ffff6f","brightBlue":"#6f6fff","brightMagenta":"#ff6fff","brightCyan":"#6fffff","brightWhite":"#ffffff"}'
      - bash
      - -c
      - 'export PATH=$(ls -d /host/usr/local/sbin /host/usr/local/bin /host/usr/sbin /host/usr/bin /host/sbin /host/bin /host/root/.local/bin /home/debian/.local/bin /home/debian/.opencode/bin 2>/dev/null | tr "\n" ":")/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:$PATH && cd /host/var/www/custom/projects/jehpok/repo && exec bash'

    volumes:
      - /:/host:rw
      - /var/run/docker.sock:/var/run/docker.sock:rw
      # Bind host SSH dir so git push/pull works inside the container using
      # the host's deploy key. Read-only — the container should never write
      # to /home/debian/.ssh.
      - /home/debian/.ssh:/root/.ssh:ro

    healthcheck:
      # The ttyd image (Alpine, minimal) ships no wget/curl/nc. Use bash's
      # /dev/tcp builtin (the container's command already runs bash; healthcheck
      # invokes bash explicitly so /dev/tcp works regardless of the entrypoint
      # shell).
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/7681 && echo -e 'GET / HTTP/1.0\\r\\n\\r\\n' >&3 && grep -qi ttyd <&3"]
      interval: 30s
      timeout: 5s
      retries: 3

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    networks:
      - net

networks:
  net:
    external: true
