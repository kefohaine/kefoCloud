services:
  terminal:
    build:
      context: .
      dockerfile: Dockerfile
    image: jehpok/terminal:1
    container_name: terminal
    restart: unless-stopped
    privileged: true

    expose:
      - "7681"

    command:
      - ttyd
      - -W
      - -t
      - fontSize=14
      - -t
      - theme={"background":"#1e1e1e","foreground":"#d4d4d4"}
      - bash
      - -c
      - 'export PATH=$(ls -d /host/usr/local/sbin /host/usr/local/bin /host/usr/sbin /host/usr/bin /host/sbin /host/bin /host/root/.local/bin /home/debian/.local/bin /home/debian/.opencode/bin 2>/dev/null | tr "\n" ":")/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:$PATH && cd /host/var/www/github/jehpok.com/repo && exec bash'

    volumes:
      - /:/host:rw
      - /var/run/docker.sock:/var/run/docker.sock:rw
      # Bind host SSH dir so git push/pull works inside the container using
      # the host's deploy key. Read-only — the container should never write
      # to /home/debian/.ssh.
      - /home/debian/.ssh:/root/.ssh:ro

    healthcheck:
      # The ttyd image (Alpine, minimal) ships no wget/curl/nc. Use bash's
      # /dev/tcp builtin (the container's command already runs bash; healthcheck
      # invokes bash explicitly so /dev/tcp works regardless of the entrypoint
      # shell).
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/7681 && echo -e 'GET / HTTP/1.0\\r\\n\\r\\n' >&3 && grep -qi ttyd <&3"]
      interval: 30s
      timeout: 5s
      retries: 3

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    networks:
      - net

networks:
  net:
    external: true
