services:
  minecraft:
    image: itzg/minecraft-server:latest
    container_name: minecraft
    restart: unless-stopped

    environment:
      # Java edition (latest stable).
      VERSION: LATEST
      TYPE: PAPER
      # Bedrock port; Java listens on 25565 by default.
      BEDROCK_PORT: "19132"
      # Memory cap; itzg image sets Xms=Xmx from MEMORY.
      MEMORY: "2G"
      DIFFICULTY: normal
      MODE: survival
      MAX_PLAYERS: "20"
      # rcon so the dashboard can run server commands.
      ENABLE_RCON: "true"
      RCON_PORT: "25575"
      RCON_PASSWORD: "change-me-via-dashboard"
      # itzg images handle EULA.
      EULA: "TRUE"
      TZ: UTC

    # itzg/minecraft-server does not auto-install Geyser/Floodgate from env
    # vars. The init script fetches the Spigot JARs into /data/plugins so a
    # fresh volume still ends up Java + Bedrock on one server.
    entrypoint: ["/bin/sh", "-c", "bash /etc/mc-plugins/init.sh && exec /start"]
    volumes:
      - /var/www/custom/projects/jehpok/minecraft/data:/data
      - ./plugins:/etc/mc-plugins:ro

    ports:
      # Game traffic — DNS A record on mc.jehpok.com points to VPS IP.
      # Cloudflare is not involved for game traffic.
      - "25565:25565"   # Java edition (TCP)
      - "19132:19132"   # Bedrock edition (TCP+UDP)
      - "19132:19132/udp"
      # rcon for the dashboard, loopback only.
      - "127.0.0.1:25575:25575"

    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/25565 || exit 1'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    # Pin both bridge IPs. Caddy's @mc upstream (minecraft-web @ .8) is one
    # reason; the other is that minecraft itself sits on .7 by convention —
    # nothing else in the repo hardcodes this IP, but pinning it makes
    # `docker network inspect net` output deterministic across recreates
    # (the itzg image's entrypoint init can take >90s, so `docker compose
    # up` recreates are common during iteration).
    networks:
      net:
        ipv4_address: 172.22.0.7

  minecraft-web:
    build: .
    image: jehpok/minecraft-web:1
    container_name: minecraft-web
    restart: unless-stopped

    expose:
      - "5000"

    # Pin the bridge IP so Caddy's @mc upstream (172.22.0.8:5000) stays valid
    # across recreates. Without this Docker assigns the next free /16 address,
    # and a container named `minecraft-web` could land on .8 one run and .9 the
    # next. The other pinned upstreams in services/domain/Caddyfile rely on
    # this convention too.
    networks:
      net:
        ipv4_address: 172.22.0.8

    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:5000/mc/healthz').read()\" || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    environment:
      RCON_HOST: minecraft
      RCON_PORT: "25575"
      RCON_PASSWORD: "change-me-via-dashboard"
      SERVER_DIR: /server

    volumes:
      # Bind the game server's data dir rw so the dashboard can rewrite
      # server.properties (the form at /mc/config POSTs here). The dashboard
      # only writes server.properties — not world data, plugins, or logs —
      # so even with rw, accidental file touches from the dashboard can't
      # corrupt game state. Game data safety still relies on the game
      # container being the only writer of /data/world etc.
      - /var/www/custom/projects/jehpok/minecraft/data:/server:rw
      - ../../content/minecraft:/app/src:ro
      # Docker socket so the dashboard can start/stop/restart the game
      # container via the Python docker SDK (see services/minecraft/Dockerfile).
      - /var/run/docker.sock:/var/run/docker.sock

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  net:
    external: true
