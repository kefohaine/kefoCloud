services:
  share:
    build: .
    image: jehpok/share:1
    container_name: share
    restart: unless-stopped

    expose:
      - "5000"

    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:5000/healthz').read()\" || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    volumes:
      - /var/www/github/jehpok.com/share/db:/data
      - ../../content/share:/app/src:ro

    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

    networks:
      - net

networks:
  net:
    external: true