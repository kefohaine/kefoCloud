services:
  homer:
    image: b4bz/homer:v25.11.1
    container_name: homer
    restart: unless-stopped

    expose:
      - "8080"

    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    volumes:
      # Homer reads /www/assets/config.yml. Bind only that file so the bundled
      # icons/themes/manifest stay intact. Edit services/homer/config/config.yml
      # and `make restart-homer` to apply.
      - ../../services/homer/config/config.yml:/www/assets/config.yml

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    networks:
      - net

networks:
  net:
    external: true
