<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>server — doors</title>
<style>
  :root { --w:#eaeaea; --gray:#8b949e; --green:#3bf07a; --purple:#b48cff;
          --amber:#ffcc66; --bg:#07090a; --sel:#12331f; }
  * { box-sizing:border-box; }
  html,body { min-height:100%; }
  body { margin:0; background:var(--bg); color:var(--gray);
         font:15px/1.6 "Menlo","DejaVu Sans Mono",monospace;
         display:flex; flex-direction:column; align-items:center; justify-content:center;
         padding:2.5rem; }
  body::after { content:""; position:fixed; inset:0; pointer-events:none; opacity:.045;
         background:repeating-linear-gradient(0deg,#fff 0 1px,transparent 1px 3px); }
  .stage { width:min(720px,94vw); }
  h1 { margin:0 0 .2rem; font-size:1.05rem; font-weight:600; color:var(--w); letter-spacing:.02em; }
  .sub { color:var(--gray); margin:0 0 1.6rem; }
  .sub b { color:var(--amber); font-weight:600; }
  ul.doors { list-style:none; margin:0; padding:0; }
  ul.doors li { display:flex; align-items:baseline; gap:.6ch; padding:.18rem 0; }
  .host { color:var(--green); text-decoration:none; }
  .host:hover, .host:focus { text-decoration:underline; }
  .note { color:var(--gray); }
  .pages { margin-left:auto; display:flex; gap:.7ch; flex-wrap:wrap; }
  .pg { color:var(--purple); text-decoration:none; }
  .pg:hover, .pg:focus { text-decoration:underline; }
  .fresh { margin-top:1.6rem; color:var(--gray); font-size:.85rem; }
  .fresh .dot { color:var(--green); }
  .err { color:var(--red,#ff7b7b); }
  @media (max-width:640px) {
    ul.doors li { flex-direction:column; gap:0; }
    .pages { margin-left:calc(4ch + .6ch); flex-direction:row; }
  }
</style>
</head>
<body>
<div class="stage">
  <h1>fxmq.net — every door</h1>
  <p class="sub">the complete list of this domain's webpages — public and tailnet-only — fetched live from <b>/targets.json</b> on every visit. nothing is stored in the browser.</p>
  <ul class="doors" id="doors"></ul>
  <p class="fresh" id="fresh"><span class="dot">&#9679;</span> live</p>
</div>
<script>
"use strict";
// The tailnet homepage: no terminal, no session, no commands — just the
// complete door list, re-fetched from the generated catalogue on EVERY
// load (cache: "no-store" + the vhost's no-cache headers guarantee a
// fresh response). tail targets (url === "/") link within this vhost;
// every other target links to its own host.
var doorsEl = document.getElementById("doors"),
    freshEl = document.getElementById("fresh");
function esc(s) {
  return String(s).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
  });
}
function render(targets, stamp) {
  doorsEl.textContent = "";
  targets.forEach(function (t) {
    var li = document.createElement("li");
    var a = document.createElement("a");
    a.className = "host";
    a.href = t.url;
    a.textContent = t.host;
    li.appendChild(a);
    var pages = Object.keys(t.pages || {}).sort();
    if (pages.length) {
      var wrap = document.createElement("span");
      wrap.className = "pages";
      pages.forEach(function (p) {
        var pa = document.createElement("a");
        pa.className = "pg";
        pa.href = t.url.replace(/\/$/, "") + t.pages[p];
        pa.textContent = "/" + p;
        wrap.appendChild(pa);
      });
      li.appendChild(wrap);
    }
    doorsEl.appendChild(li);
  });
  freshEl.innerHTML = '<span class="dot">&#9679;</span> fetched ' + esc(stamp) + " — " + targets.length + " doors";
}
fetch("/targets.json", { cache: "no-store" })
  .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
  .then(function (j) {
    var targets = (j && j.targets) || [];
    targets.sort(function (x, y) { return x.host < y.host ? -1 : x.host > y.host ? 1 : 0; });
    render(targets, new Date().toTimeString().slice(0, 8));
  })
  .catch(function (e) {
    doorsEl.textContent = "";
    freshEl.innerHTML = '<span class="err">could not load the door list: ' + esc(e.message) + " — refresh to retry</span>";
  });
</script>
</body>
</html>
