<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mc.fxmq.net</title>
<style>
  :root { --ink:#2d2a26; --stone:#8a7d75; --accent:#6b8e4e; --warn:#b8787f;
          --bg:#f5f1ea; --card:#fff; --border:#e6dfd4; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:system-ui,Segoe,Roboto,sans-serif; background:var(--bg); color:var(--ink);
         padding:24px; max-width:960px; margin:0 auto; }
  h1 { font-size:1.6rem; margin-bottom:4px; }
  h2 { font-size:1.1rem; margin:24px 0 12px; color:var(--accent); text-transform:uppercase;
       letter-spacing:1px; }
  .sub { color:var(--stone); font-size:.85rem; margin-bottom:24px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:12px; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:10px; padding:16px; }
  .card .v { font-size:1.8rem; font-weight:600; color:var(--accent); }
  .card .k { font-size:.8rem; color:var(--stone); text-transform:uppercase; letter-spacing:1px; }
  .status-card .v { font-size:1.4rem; }
  .pill { display:inline-block; padding:4px 14px; border-radius:999px; font-size:1.1rem;
          font-weight:600; color:#fff; }
  .pill-on  { background:var(--accent); }
  .pill-off { background:var(--warn); }
  .pub { font-family:monospace; color:var(--stone); font-size:.85rem; background:var(--card);
         border:1px solid var(--border); border-radius:8px; padding:12px; margin-bottom:16px; }
  a { color:var(--accent); }
  .links { margin-top:24px; }
  .links a { display:inline-block; margin-right:12px; padding:8px 14px; border-radius:6px;
             background:var(--accent); color:#fff; text-decoration:none; font-weight:600; }
  .links a.warn { background:var(--warn); }
  .stats-error { color:var(--warn); margin-top:8px; font-size:.9rem; }
</style>
</head>
<body>
<h1>mc.fxmq.net</h1>
<p class="sub">Welcome to the homelab Minecraft server</p>

<div class="pub">
  <strong>Connect:</strong>
  Java: <code>mc.fxmq.net:25565</code> &middot;
  Bedrock: <code>mc.fxmq.net:19132</code> (via Geyser)
</div>

<h2>Server status</h2>
<div class="grid">
  <div class="card status-card">
    <div class="v pill pill-off" id="java-pill">checking&hellip;</div>
    <div class="k">Java :25565</div>
  </div>
  <div class="card"><div class="v" id="java-version">—</div>
       <div class="k">Java version</div></div>
  <div class="card"><div class="v" id="java-players">—</div>
       <div class="k">Players</div></div>
  <div class="card status-card">
    <div class="v pill pill-off" id="bedrock-pill">checking&hellip;</div>
    <div class="k">Bedrock :19132</div>
  </div>
  <div class="card"><div class="v" id="bedrock-version">—</div>
       <div class="k">Bedrock version</div></div>
  <div class="card"><div class="v" id="bedrock-players">—</div>
       <div class="k">Players</div></div>
</div>
<p id="stats-error" class="stats-error" style="display:none;"></p>

<div class="links">
  <a href="/panel">Server panel</a>
  <a href="/download" class="warn">Downloads</a>
</div>

<script>
(function () {
  const $ = (id) => document.getElementById(id);
  const fmt = (v) => (v === null || v === undefined) ? '—' : v;
  const setPill = (id, online) => {
    const el = $(id);
    el.textContent = online ? 'online' : 'offline';
    el.className = 'v pill ' + (online ? 'pill-on' : 'pill-off');
  };
  const players = (s) => {
    if (s.players === null || s.players === undefined) return '—';
    return (s.max === null || s.max === undefined) ? String(s.players) : s.players + ' / ' + s.max;
  };
  const setError = (msg) => {
    const el = $('stats-error');
    if (msg) { el.textContent = msg; el.style.display = ''; }
    else    { el.textContent = '';     el.style.display = 'none'; }
  };
  const refresh = async () => {
    try {
      const r = await fetch('/status', { cache: 'no-store' });
      if (!r.ok) throw new Error('HTTP ' + r.status);
      const s = await r.json();
      setPill('java-pill', !!s.java.online);
      $('java-version').textContent = fmt(s.java.version);
      $('java-players').textContent = players(s.java);
      setPill('bedrock-pill', !!s.bedrock.online);
      $('bedrock-version').textContent = fmt(s.bedrock.version);
      $('bedrock-players').textContent = players(s.bedrock);
      setError(null);
    } catch (e) {
      setError('status check failed: ' + e.message);
    }
  };
  refresh();
  setInterval(refresh, 15000);
})();
</script>

</body>
</html>
