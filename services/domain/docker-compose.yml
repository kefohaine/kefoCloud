services:
  domain:
    image: caddy:2.11.4
    container_name: domain
    restart: unless-stopped

    # Host network so Caddy sees the real client source IP — without it,
    # Docker DNAT rewrites every packet to 172.22.0.1 (the bridge gateway)
    # before Caddy sees it, which breaks the @not_tailnet remote_ip matcher
    # on https://server.jehpok.com. The host network namespace is on the
    # `net` bridge at 172.22.0.0/16, so Caddy can still reach upstream
    # containers by their bridge IP (172.22.0.2 .. .9 — see Caddyfile).
    network_mode: host

    healthcheck:
      test: ["CMD", "caddy", "version"]
      interval: 30s
      timeout: 5s
      retries: 3

    volumes:
      - ../..:/srv:ro
      - /var/www/custom/projects/jehpok/cloud/html:/nextcloud:ro
      - /var/www/custom/projects/jehpok/share/files:/files:ro
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - /var/www/custom/projects/jehpok/certs:/certs:ro

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
