services:
  vault:
    image: vaultwarden/server:latest
    container_name: vaultwarden
    restart: unless-stopped

    # Hard RAM cap (no container swap) — survives recreates, unlike `docker update`.
    mem_limit: 512m
    memswap_limit: 512m

    environment:
      DOMAIN: https://vault.fxmq.net
      SIGNUPS_ALLOWED: "false"
      INVITATIONS_ALLOWED: "false"
      SHOW_PASSWORD_HINT: "false"
      ROCKET_PORT: "80"
      # SMTP — verification / invite / notification emails via the local
      # mailserver (vaultwarden@fxmq.net sender mailbox, STARTTLS on 587).
      # Values come from services/vaultwarden/.env (gitignored — generated
      # by scripts/install.sh seed_stack; see vaultwarden_setup).
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_SECURITY: ${SMTP_SECURITY}
      SMTP_USERNAME: ${SMTP_USERNAME}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM: ${SMTP_FROM}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME}
      SMTP_AUTH_MECHANISM: ${SMTP_AUTH_MECHANISM}

    extra_hosts:
      # Map the cert FQDN to the mail container's bridge IP so SMTP TLS
      # SNI + cert verification see mail.fxmq.net (same pattern as the
      # nextcloud container — the LE cert CN must match the host).
      - "mail.fxmq.net:172.22.0.9"

    volumes:
      - /var/www/custom/projects/homelab/vault/data:/data

    expose:
      - "80"

    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost/alive"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    # Pin the bridge IP — services/vhosts/Caddyfile hardcodes
    # 172.22.0.4:80 for the vaultwarden upstream.
    networks:
      net:
        ipv4_address: 172.22.0.4

networks:
  net:
    external: true