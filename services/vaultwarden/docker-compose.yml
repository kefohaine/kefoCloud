services:
  vault:
    image: vaultwarden/server:latest
    container_name: vaultwarden
    restart: unless-stopped

    environment:
      DOMAIN: https://vault.fxmq.net
      SIGNUPS_ALLOWED: "false"
      INVITATIONS_ALLOWED: "false"
      SHOW_PASSWORD_HINT: "false"
      ROCKET_PORT: "80"

    volumes:
      - /var/www/custom/projects/homelab/vault/data:/data

    expose:
      - "80"

    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost/alive"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    # Pin the bridge IP — services/vhosts/Caddyfile hardcodes
    # 172.22.0.4:80 for the vaultwarden upstream.
    networks:
      net:
        ipv4_address: 172.22.0.4

networks:
  net:
    external: true