services:
  share:
    build: .
    image: jehpok/share:1
    container_name: share-flask
    restart: unless-stopped

    expose:
      - "5000"

    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:5000/healthz').read()\" || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    volumes:
      - /var/www/custom/projects/jehpok/share/db:/data
      - /var/www/custom/projects/jehpok/share/files:/data/files
      - ../../content/share:/app/src:ro

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    # Pin the bridge IP — services/vhosts/Caddyfile hardcodes
    # 172.22.0.3:5000 for the share-flask upstream (both @share on server.jehpok.com
    # and the main reverse_proxy on share.jehpok.com).
    networks:
      net:
        ipv4_address: 172.22.0.3

networks:
  net:
    external: true