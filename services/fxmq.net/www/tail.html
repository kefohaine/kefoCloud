<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>server</title>
<style>
  :root { --w:#eaeaea; --gray:#8b949e; --green:#3bf07a; --purple:#b48cff;
          --amber:#ffcc66; --red:#ff7b7b; --bg:#07090a; --sel:#12331f; }
  * { box-sizing:border-box; }
  html,body { height:100%; }
  body { margin:0; background:var(--bg); color:var(--gray);
         font:15px/1.6 "Menlo","DejaVu Sans Mono",monospace;
         display:flex; flex-direction:column; align-items:center; justify-content:center; padding:2rem; }
  body::after { content:""; position:fixed; inset:0; pointer-events:none; opacity:.045;
         background:repeating-linear-gradient(0deg,#fff 0 1px,transparent 1px 3px); }
  .stage { width:min(760px,94vw); }
  .cmdline { position:relative; display:flex; align-items:baseline; white-space:pre; }
  .ps1 { flex:none; }
  .acc   { color:var(--green); }
  .wh    { color:var(--w); }
  .pth   { color:var(--purple); }
  #cmd { flex:1; min-width:0; margin:0; border:0; outline:0; padding:0; background:transparent;
         color:var(--w); caret-color:transparent; font:inherit; }
  #cmd::selection { background:var(--sel); }
  .ghost { position:absolute; top:0; color:var(--gray); pointer-events:none; white-space:pre; }
  .cursor { position:absolute; top:-0.08em; height:1.5em; line-height:1.5em;
            background:#fff; color:#000; pointer-events:none; white-space:pre; overflow:hidden; }
  .sug { list-style:none; margin:.5rem 0 0; padding:0; color:var(--gray); }
  .sug li { padding:0; cursor:pointer; }
  .sug li.on { color:var(--w); background:var(--sel); }
  .sug li b { color:var(--w); font-weight:600; }
  .status { margin-top:.7rem; min-height:1.6em; color:var(--gray); }
  .status.err { color:var(--red); }
  .psw { position:relative; display:none; align-items:baseline; margin-top:.6rem; white-space:pre; }
  .psw .lab { color:var(--amber); }
  .psw input { flex:0 1 22ch; margin:0 .5ch 0 1ch; border:0; outline:0; padding:0;
               background:transparent; color:var(--w); font:inherit;
               -webkit-text-security:disc; }
  .psw input::placeholder { color:var(--gray); opacity:1; }
</style>
</head>
<body>
<div class="stage">
  <div class="cmdline" id="line">
    <span class="ps1" id="ps1"><span class="acc" id="acc">guest@server</span><span class="wh">:</span><span class="pth">~</span><span class="wh">$ </span></span>
    <input id="cmd" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" autofocus>
    <span class="ghost" id="ghost"></span>
    <span class="cursor" id="cursor"></span>
  </div>
  <ul class="sug" id="sug"></ul>
  <div class="psw" id="pswline">
    <span class="lab">password:</span>
    <input id="psw" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="·">
  </div>
  <div class="status" id="status"></div>
</div>

<script>
"use strict";
var VERBS = ["go", "log"];          // the command surface
var LOGC  = ["in", "out"];          // `log`'s second column
var TARGETS = [];                   // filled from targets.json (generated)
var cmd = document.getElementById("cmd"),
    line = document.getElementById("line"),
    acc = document.getElementById("acc"),
    ghost = document.getElementById("ghost"),
    cursor = document.getElementById("cursor"),
    sug = document.getElementById("sug"),
    pswline = document.getElementById("pswline"),
    psw = document.getElementById("psw"),
    statusEl = document.getElementById("status");
var items = [], pick = 0, measure = null, sayTimer = null;

// Session: per-tab sessionStorage flag ONLY. The browser's basic-auth cache is
// never the login — `log in` prompts for the password inline (masked), then
// validates it in the background against /ttyd with an explicit Authorization
// header (a 401 to a fetch raises no dialog), so a cached credential on /ttyd
// never silently logs this page in. `log out` drops the session flag AND
// evicts any cached /ttyd credential (primed fetch with a bogus one), so
// nothing is remembered after logout — /ttyd then prompts again on next visit.
function authed() { try { return sessionStorage.getItem("tailAuthed") === "1"; } catch (e) { return false; } }
function setAuthed(v) { try { v ? sessionStorage.setItem("tailAuthed", "1") : sessionStorage.removeItem("tailAuthed"); } catch (e) {} }
function prompt() { acc.textContent = (authed() ? "kefohaine@server" : "guest@server"); }
function say(msg, isErr) {
  if (sayTimer) { clearTimeout(sayTimer); sayTimer = null; }
  statusEl.textContent = msg || "";
  statusEl.className = "status" + (isErr ? " err" : "");
  if (msg) sayTimer = setTimeout(function () { statusEl.textContent = ""; statusEl.className = "status"; }, 3000);
}
function textWidth(s) {
  if (!measure) {
    measure = document.createElement("span");
    measure.style.cssText = "position:absolute;visibility:hidden;white-space:pre;left:-9999px;top:0;font:inherit";
    document.body.appendChild(measure);
  }
  measure.textContent = s;
  return measure.getBoundingClientRect().width;
}
function fit() {
  var off = cmd.getBoundingClientRect().left - line.getBoundingClientRect().left;
  ghost.style.left = (off + textWidth(cmd.value)) + "px";
}
// Debian-style block cursor: a solid white cell over the character at the
// caret; the cell's own text renders inverted (black on white). A space at
// the caret shows as a full-width white block.
function caret() {
  var i = cmd.selectionStart == null ? cmd.value.length : cmd.selectionStart;
  var off = cmd.getBoundingClientRect().left - line.getBoundingClientRect().left;
  var before = cmd.value.slice(0, i);
  var ch = cmd.value.charAt(i) || " ";
  cursor.style.left = (off + textWidth(before)) + "px";
  cursor.style.width = Math.max(textWidth(ch), textWidth(" ")) + "px";
  cursor.textContent = ch;
}
function byName(n) { for (var i = 0; i < TARGETS.length; i++) if (TARGETS[i].name === n) return TARGETS[i]; return null; }
function columns(src) {
  var trail = /[ ]$/.test(src);
  var toks = src.trim() ? src.trim().split(/\s+/) : [];
  return { heads: trail ? toks : toks.slice(0, -1), partial: trail ? "" : (toks[toks.length - 1] || "") };
}
// Predict the ONE column currently being typed — never a whole-line guess.
function candidates() {
  var src = cmd.value;
  if (!src) return [];                                  // no text, no prediction
  var c = columns(src), out = [];
  if (c.heads.length === 0) {
    out = VERBS.filter(function (v) { return v.indexOf(c.partial) === 0; });
  } else if (c.heads[0] === "go") {
    if (c.heads.length === 1) {
      out = TARGETS.map(function (t) { return t.name; })
                   .filter(function (n) { return n.indexOf(c.partial) === 0; })
                   .map(function (n) { return "go " + n; });
    } else if (c.heads.length === 2) {
      var t = byName(c.heads[1]);
      if (t) out = Object.keys(t.pages).filter(function (p) { return p.indexOf(c.partial) === 0; })
                                        .map(function (p) { return "go " + c.heads[1] + " " + p; });
    }
  } else if (c.heads[0] === "log" && c.heads.length === 1) {
    out = LOGC.filter(function (s) { return s.indexOf(c.partial) === 0; })
              .map(function (s) { return "log " + s; });
  }
  return out;
}
function hasDeeper(c) {
  var save = cmd.value; cmd.value = c + " ";
  var more = candidates().length > 0;
  cmd.value = save; return more;
}
function render() {
  var v = cmd.value, list = candidates();
  items = list;
  if (pick >= list.length || pick < 0) pick = 0;
  sug.innerHTML = "";
  list.slice(0, 12).forEach(function (c, i) {
    var li = document.createElement("li");
    if (i === pick) li.className = "on";
    var hit = document.createElement("b");
    hit.textContent = c.slice(0, v.length);
    li.appendChild(hit);
    li.appendChild(document.createTextNode(c.slice(v.length)));
    li.addEventListener("mousedown", function (ev) { ev.preventDefault(); accept(c); });
    sug.appendChild(li);
  });
  var top = list[pick];
  ghost.textContent = (v && top && top.length > v.length) ? top.slice(v.length) : "";
  fit();
  caret();
}
function accept(c) {
  cmd.value = hasDeeper(c) ? c + " " : c;
  pick = 0; render(); cmd.focus();
}
function go(host, page) {
  var t = byName(host);
  if (!t) { say("no such vhost: " + host, true); return; }
  var to = t.url;
  if (page) {
    if (!t.pages[page]) {
      var have = Object.keys(t.pages).join(" ");
      say("no page '" + page + "' on " + host + (have ? " (have: " + have + ")" : " (no pages)"), true);
      return;
    }
    to = t.url.replace(/\/$/, "") + t.pages[page];
  }
  say("going to " + to + " …");
  setTimeout(function () { location.href = to; }, 300);
}
function run(raw) {
  var v = String(raw || "").trim().replace(/\s+/g, " ");
  if (!v) return;
  var parts = v.toLowerCase().split(" "), verb = parts[0], a = parts[1] || "", b = parts[2] || "";
  if (verb === "log") {
    if (a === "in") {
      if (authed()) { say("already logged in"); return; }
      if (pswline.style.display === "flex") return;
      pswline.style.display = "flex";
      psw.value = ""; psw.placeholder = "·";
      say("type the /ttyd password, then Enter (Esc cancels)");
      psw.focus();
      return;
    }
    if (a === "out") {
      if (!authed()) { say("not logged in"); return; }
      say("logging out …");
      // Evict the browser's basic-auth cache for /ttyd: prime it with a
      // bogus credential (the 401 to a non-navigational fetch raises no
      // dialog), so /ttyd prompts again on the next visit — nothing is
      // remembered. Then forget the session itself.
      fetch("/ttyd", { credentials: "same-origin", cache: "no-store",
                       headers: { "Authorization": "Basic " + btoa("logout:logout") } })
        .catch(function () {})
        .then(function () { setAuthed(false); prompt(); say("logged out"); });
      return;
    }
    say("usage: log in | log out", true); return;
  }
  if (verb === "go") {
    if (!authed()) { say("not logged in — run 'log in' first", true); return; }
    if (!a) { say("usage: go <vhost> [page]", true); return; }
    go(a, b); return;
  }
  say("unknown command: " + v, true);
}
// Validate the typed password against /ttyd's basic auth with an explicit
// Authorization header — never the browser's cached credential (the 401 to
// this fetch raises no dialog). On success: session flag + a status line;
// the password lives only in this JS scope, never stored anywhere.
function tryLogin() {
  var pass = psw.value;
  pswline.style.display = "none"; psw.value = ""; psw.placeholder = "·";
  cmd.focus();
  if (!pass) { say("cancelled", true); return; }
  say("checking …");
  fetch("/ttyd", { credentials: "same-origin", cache: "no-store",
                   headers: { "Authorization": "Basic " + btoa("kefohaine:" + pass) } })
    .then(function (r) {
      if (r.status === 200) { setAuthed(true); prompt(); say("logged in — go <vhost> [page]"); }
      else { say("wrong password", true); }
    })
    .catch(function () { say("could not reach /ttyd", true); });
}
psw.addEventListener("keydown", function (ev) {
  var k = ev.key || "";
  if (k === "Enter" || ev.keyCode === 13) { ev.preventDefault(); tryLogin(); }
  else if (k === "Escape") { ev.preventDefault(); pswline.style.display = "none"; psw.value = ""; say("cancelled"); }
});
// While the password line is open, clicks land on the password box, not the
// command bar.
document.addEventListener("mousedown", function (ev) {
  if (pswline.style.display !== "flex" || ev.target === psw || pswline.contains(ev.target)) return;
  ev.preventDefault();
  psw.focus();
});
cmd.addEventListener("input", function () { pick = 0; render(); });
cmd.addEventListener("keydown", function (ev) {
  var k = ev.key || "";
  if (k === "Enter" || ev.keyCode === 13) {
    ev.preventDefault();
    var v = cmd.value; cmd.value = ""; pick = 0; render(); run(v);
  } else if (k === "Tab" || k === "ArrowRight") {
    if (items[pick]) { ev.preventDefault(); accept(items[pick]); }
  } else if (k === "ArrowDown") { if (items.length) { ev.preventDefault(); pick = (pick + 1) % items.length; render(); } }
  else if (k === "ArrowUp") { if (items.length) { ev.preventDefault(); pick = (pick <= 0 ? items.length : pick) - 1; render(); } }
  else if (k === "Escape") { cmd.value = ""; pick = 0; render(); }
  else { setTimeout(render, 0); }
});
cmd.addEventListener("keyup", caret);
cmd.addEventListener("click", caret);
document.addEventListener("selectionchange", function () { if (document.activeElement === cmd) caret(); });
// The type bar is forced-focused: any click that is not on the input itself
// or on a suggestion entry lands back on the input (the dropdown's own
// mousedown handler accepts the entry first, so it keeps working).
document.addEventListener("mousedown", function (ev) {
  if (ev.target === cmd || sug.contains(ev.target) || pswline.contains(ev.target)) return;
  ev.preventDefault();
  cmd.focus();
});
cmd.addEventListener("blur", function () {
  if (pswline.style.display === "flex") return;   // the password prompt owns focus
  setTimeout(function () { if (document.hasFocus()) cmd.focus(); caret(); }, 0);
});
window.addEventListener("resize", function () { fit(); caret(); });

prompt();
render();
fetch("/targets.json", { cache: "no-store" }).then(function (r) { return r.json(); })
  .then(function (j) { TARGETS = (j && j.targets) || []; render(); })
  .catch(function () { say("could not load the target list", true); });
cmd.focus();
</script>
</body>
</html>
