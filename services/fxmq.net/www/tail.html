<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>server</title>
<style>
  :root { --fg:#3bf07a; --dim:#1f8a4c; --amber:#ffcc66; --red:#ff7b7b; --bg:#07090a; }
  * { box-sizing:border-box; }
  html,body { height:100%; }
  body { margin:0; background:var(--bg); color:var(--fg);
         font:15px/1.6 "Menlo","DejaVu Sans Mono",monospace;
         display:flex; flex-direction:column; align-items:center; justify-content:center; padding:2rem; }
  body::after { content:""; position:fixed; inset:0; pointer-events:none; opacity:.045;
         background:repeating-linear-gradient(0deg,#fff 0 1px,transparent 1px 3px); }
  .stage { width:min(760px,94vw); }
  .cmdline { position:relative; display:flex; align-items:baseline; white-space:pre; }
  .ps1 { color:var(--fg); flex:none; }
  #cmd { flex:1; min-width:0; margin:0; border:0; outline:0; padding:0; background:transparent;
         color:var(--fg); caret-color:var(--fg); font:inherit; }
  #cmd::selection { background:var(--dim); }
  .ghost { position:absolute; top:0; color:var(--dim); pointer-events:none; white-space:pre; }
  .sug { list-style:none; margin:.5rem 0 0; padding:0; color:var(--dim); }
  .sug li { padding:0; cursor:pointer; }
  .sug li.on { color:#fff; background:#0f1a14; }
  .sug li b { color:var(--amber); font-weight:600; }
  .status { margin-top:.7rem; min-height:1.6em; color:var(--dim); }
  .status.err { color:var(--red); }
</style>
</head>
<body>
<div class="stage">
  <div class="cmdline" id="line">
    <span class="ps1" id="ps1">guest@server:~$ </span>
    <input id="cmd" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" autofocus>
    <span class="ghost" id="ghost"></span>
  </div>
  <ul class="sug" id="sug"></ul>
  <div class="status" id="status"></div>
</div>

<script>
"use strict";
var VERBS = ["go", "log"];          // the command surface
var LOGC  = ["in", "out"];          // `log`'s second column
var TARGETS = [];                   // filled from targets.json (generated)
var cmd = document.getElementById("cmd"),
    line = document.getElementById("line"),
    ps1 = document.getElementById("ps1"),
    ghost = document.getElementById("ghost"),
    sug = document.getElementById("sug"),
    statusEl = document.getElementById("status");
var items = [], pick = 0, measure = null, sayTimer = null;

function authed() { try { return sessionStorage.getItem("tailAuthed") === "1"; } catch (e) { return false; } }
function setAuthed(v) { try { v ? sessionStorage.setItem("tailAuthed", "1") : sessionStorage.removeItem("tailAuthed"); } catch (e) {} }
function prompt() { ps1.textContent = (authed() ? "kefohaine@server" : "guest@server") + ":~$ "; }
function say(msg, isErr) {
  if (sayTimer) { clearTimeout(sayTimer); sayTimer = null; }
  statusEl.textContent = msg || "";
  statusEl.className = "status" + (isErr ? " err" : "");
  if (msg) sayTimer = setTimeout(function () { statusEl.textContent = ""; statusEl.className = "status"; }, 3000);
}
function textWidth(s) {
  if (!measure) {
    measure = document.createElement("span");
    measure.style.cssText = "position:absolute;visibility:hidden;white-space:pre;left:-9999px;top:0;font:inherit";
    document.body.appendChild(measure);
  }
  measure.textContent = s;
  return measure.getBoundingClientRect().width;
}
function fit() {
  var off = cmd.getBoundingClientRect().left - line.getBoundingClientRect().left;
  ghost.style.left = (off + textWidth(cmd.value)) + "px";
}
function byName(n) { for (var i = 0; i < TARGETS.length; i++) if (TARGETS[i].name === n) return TARGETS[i]; return null; }
function columns(src) {
  var trail = /[ ]$/.test(src);
  var toks = src.trim() ? src.trim().split(/\s+/) : [];
  return { heads: trail ? toks : toks.slice(0, -1), partial: trail ? "" : (toks[toks.length - 1] || "") };
}
// Predict the ONE column currently being typed — never a whole-line guess.
function candidates() {
  var src = cmd.value;
  if (!src) return [];                                  // no text, no prediction
  var c = columns(src), out = [];
  if (c.heads.length === 0) {
    out = VERBS.filter(function (v) { return v.indexOf(c.partial) === 0; });
  } else if (c.heads[0] === "go") {
    if (c.heads.length === 1) {
      out = TARGETS.map(function (t) { return t.name; })
                   .filter(function (n) { return n.indexOf(c.partial) === 0; })
                   .map(function (n) { return "go " + n; });
    } else if (c.heads.length === 2) {
      var t = byName(c.heads[1]);
      if (t) out = Object.keys(t.pages).filter(function (p) { return p.indexOf(c.partial) === 0; })
                                        .map(function (p) { return "go " + c.heads[1] + " " + p; });
    }
  } else if (c.heads[0] === "log" && c.heads.length === 1) {
    out = LOGC.filter(function (s) { return s.indexOf(c.partial) === 0; })
              .map(function (s) { return "log " + s; });
  }
  return out;
}
function hasDeeper(c) {
  var save = cmd.value; cmd.value = c + " ";
  var more = candidates().length > 0;
  cmd.value = save; return more;
}
function render() {
  var v = cmd.value, list = candidates();
  items = list;
  if (pick >= list.length || pick < 0) pick = 0;
  sug.innerHTML = "";
  list.slice(0, 12).forEach(function (c, i) {
    var li = document.createElement("li");
    if (i === pick) li.className = "on";
    var hit = document.createElement("b");
    hit.textContent = c.slice(0, v.length);
    li.appendChild(hit);
    li.appendChild(document.createTextNode(c.slice(v.length)));
    li.addEventListener("mousedown", function (ev) { ev.preventDefault(); accept(c); });
    sug.appendChild(li);
  });
  var top = list[pick];
  ghost.textContent = (v && top && top.length > v.length) ? top.slice(v.length) : "";
  fit();
}
function accept(c) {
  cmd.value = hasDeeper(c) ? c + " " : c;
  pick = 0; render(); cmd.focus();
}
function go(host, page) {
  var t = byName(host);
  if (!t) { say("no such vhost: " + host, true); return; }
  var to = t.url;
  if (page) {
    if (!t.pages[page]) {
      var have = Object.keys(t.pages).join(" ");
      say("no page '" + page + "' on " + host + (have ? " (have: " + have + ")" : " (no pages)"), true);
      return;
    }
    to = t.url.replace(/\/$/, "") + t.pages[page];
  }
  say("going to " + to + " …");
  setTimeout(function () { location.href = to; }, 300);
}
function run(raw) {
  var v = String(raw || "").trim().replace(/\s+/g, " ");
  if (!v) return;
  var parts = v.toLowerCase().split(" "), verb = parts[0], a = parts[1] || "", b = parts[2] || "";
  if (verb === "log") {
    if (a === "in") { say("authenticating …"); setTimeout(function () { location.href = "/__tail/login"; }, 300); return; }
    if (a === "out") { setAuthed(false); prompt(); say("logged out"); setTimeout(function () { location.href = "https://logout:logout@" + location.host + "/"; }, 400); return; }
    say("usage: log in | log out", true); return;
  }
  if (verb === "go") {
    if (!authed()) { say("not logged in — run 'log in' first", true); return; }
    if (!a) { say("usage: go <vhost> [page]", true); return; }
    go(a, b); return;
  }
  say("unknown command: " + v, true);
}
cmd.addEventListener("input", function () { pick = 0; render(); });
cmd.addEventListener("keydown", function (ev) {
  var k = ev.key || "";
  if (k === "Enter" || ev.keyCode === 13) {
    ev.preventDefault();
    var v = cmd.value; cmd.value = ""; pick = 0; render(); run(v);
  } else if (k === "Tab" || k === "ArrowRight") {
    if (items[pick]) { ev.preventDefault(); accept(items[pick]); }
  } else if (k === "ArrowDown") { if (items.length) { ev.preventDefault(); pick = (pick + 1) % items.length; render(); } }
  else if (k === "ArrowUp") { if (items.length) { ev.preventDefault(); pick = (pick <= 0 ? items.length : pick) - 1; render(); } }
  else if (k === "Escape") { cmd.value = ""; pick = 0; render(); }
  else { setTimeout(render, 0); }
});
line.addEventListener("mousedown", function (ev) { if (ev.target !== cmd) { ev.preventDefault(); cmd.focus(); } });
window.addEventListener("resize", fit);

if (location.pathname === "/__tail/login" || /[?&]authed=1/.test(location.search)) {
  setAuthed(true);
  try { history.replaceState(null, "", "/"); } catch (e) {}
}
prompt();
render();
fetch("/targets.json", { cache: "no-store" }).then(function (r) { return r.json(); })
  .then(function (j) { TARGETS = (j && j.targets) || []; render(); })
  .catch(function () { say("could not load the target list", true); });
cmd.focus();
</script>
</body>
</html>
