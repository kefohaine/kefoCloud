<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>kefohaine@server</title>
<style>
  :root { --fg:#3bf07a; --dim:#1f8a4c; --amber:#ffcc66; --red:#ff7b7b; --bg:#07090a; }
  * { box-sizing:border-box; }
  html,body { height:100%; }
  body { margin:0; background:var(--bg); color:var(--fg);
         font:15px/1.6 "Menlo","DejaVu Sans Mono","DejaVu Sans Mono",monospace;
         display:flex; flex-direction:column; align-items:center; justify-content:center; padding:2rem; }
  body::after { content:""; position:fixed; inset:0; pointer-events:none; opacity:.045;
         background:repeating-linear-gradient(0deg,#fff 0 1px,transparent 1px 3px); }
  .brand { position:fixed; top:1.6rem; left:0; right:0; text-align:center; color:var(--dim); font-size:.8em; letter-spacing:.08em; }
  .brand b { color:var(--fg); }
  .stage { width:min(760px,94vw); }
  .cmdline { position:relative; display:flex; align-items:baseline; white-space:pre; }
  .ps1 { color:var(--fg); flex:none; }
  #cmd { flex:1; min-width:0; margin:0; border:0; outline:0; padding:0; background:transparent;
         color:var(--fg); caret-color:var(--fg); font:inherit; }
  #cmd::selection { background:var(--dim); }
  .ghost { position:absolute; top:0; color:var(--dim); pointer-events:none; white-space:pre; }
  .sug { list-style:none; margin:.5rem 0 0; padding:0; color:var(--dim); }
  .sug li { padding:0; cursor:pointer; }
  .sug li.on { color:#fff; background:#0f1a14; }
  .sug li b { color:var(--amber); font-weight:600; }
  .status { margin-top:.7rem; min-height:1.6em; color:var(--dim); }
  .status.err { color:var(--red); }
  .bar { position:fixed; bottom:1.3rem; left:0; right:0; text-align:center; color:var(--dim); font-size:.8em; }
  .bar b { color:var(--fg); }
</style>
</head>
<body>
<div class="brand"><b>FXMQ</b> · kefohaine@server · tailnet</div>

<div class="stage">
  <div class="cmdline" id="line">
    <span class="ps1" id="ps1">kefohaine@server:~$ </span>
    <input id="cmd" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" autofocus>
    <span class="ghost" id="ghost"></span>
  </div>
  <ul class="sug" id="sug"></ul>
  <div class="status" id="status"></div>
</div>

<div class="bar">type <b>go</b> &lt;vhost&gt; [page] · <b>log in</b> · <b>log out</b> &nbsp;—&nbsp; tab completes · up/down picks · enter runs</div>

<script>
"use strict";
var MAP = {
  cloud: { url: "https://cloud.fxmq.net/", pages: {} },
  vault: { url: "https://vault.fxmq.net/", pages: {} },
  kuma:  { url: "https://kuma.fxmq.net/",  pages: {} },
  mail:  { url: "https://mail.fxmq.net/",  pages: {} },
  mc:    { url: "https://mc.fxmq.net/",    pages: { panel: "/panel", play: "/play/" } },
  talk:  { url: "https://talk.fxmq.net/",  pages: { signaling: "/signaling" } },
  www:   { url: "https://www.fxmq.net/",   pages: { welcome: "/welcome", download: "/download/" } },
  tail:  { url: "/",                        pages: { ttyd: "/ttyd/" } }
};
var VERBS = ["go", "log"];
var LOGSUB = ["log in", "log out"];

var cmd = document.getElementById("cmd"),
    line = document.getElementById("line"),
    ps1 = document.getElementById("ps1"),
    ghost = document.getElementById("ghost"),
    sug = document.getElementById("sug"),
    statusEl = document.getElementById("status");
var items = [], pick = -1, measure = null;

function authed() { try { return sessionStorage.getItem("tailAuthed") === "1"; } catch (e) { return false; } }
function setAuthed(v) { try { v ? sessionStorage.setItem("tailAuthed", "1") : sessionStorage.removeItem("tailAuthed"); } catch (e) {} }
function say(msg, isErr) { statusEl.textContent = msg || ""; statusEl.className = "status" + (isErr ? " err" : ""); }

function textWidth(s) {
  if (!measure) {
    measure = document.createElement("span");
    measure.style.cssText = "position:absolute;visibility:hidden;white-space:pre;left:-9999px;top:0;font:inherit";
    document.body.appendChild(measure);
  }
  measure.textContent = s;
  return measure.getBoundingClientRect().width;
}
function fit() {
  var off = cmd.getBoundingClientRect().left - line.getBoundingClientRect().left;
  ghost.style.left = (off + textWidth(cmd.value)) + "px";
}
function candidates() {
  var low = cmd.value.toLowerCase();
  if (low === "go" || low.indexOf("go ") === 0) {
    var rest = (low === "go") ? "" : low.slice(3);
    var parts = rest.split(" "), host = parts[0], page = parts[1];
    if (page) return [];
    if (!host) return Object.keys(MAP).map(function (k) { return "go " + k; });
    if (!MAP[host]) return Object.keys(MAP).filter(function (k) { return k.indexOf(host) === 0; })
                                    .map(function (k) { return "go " + k; });
    return Object.keys(MAP[host].pages).map(function (p) { return "go " + host + " " + p; });
  }
  if (low === "log" || low.indexOf("log ") === 0) {
    return LOGSUB.filter(function (c) { return c.indexOf(low) === 0; });
  }
  return VERBS.filter(function (c) { return c.indexOf(low) === 0; });
}
function render() {
  var v = cmd.value, low = v.toLowerCase(), list = candidates();
  if (pick >= list.length) pick = list.length - 1;
  items = list;
  sug.innerHTML = "";
  list.slice(0, 6).forEach(function (c, i) {
    var li = document.createElement("li");
    if (i === pick) li.className = "on";
    var hit = document.createElement("b");
    hit.textContent = c.slice(0, v.length);
    li.appendChild(hit);
    li.appendChild(document.createTextNode(c.slice(v.length)));
    li.addEventListener("mousedown", function (ev) { ev.preventDefault(); accept(c); });
    sug.appendChild(li);
  });
  var top = list[Math.max(0, pick)];
  ghost.textContent = (top && top.indexOf(low) === 0 && top !== low) ? top.slice(v.length) : "";
  fit();
}
function accept(c) {
  cmd.value = c;
  if (c === "go" || c === "log" || /\s$/.test(c)) cmd.value = c + " ";
  pick = -1; render(); cmd.focus();
}
function go(host, page) {
  if (!MAP[host]) { say("no such vhost: " + host + " (have: " + Object.keys(MAP).join(" ") + ")", true); return false; }
  var to = MAP[host].url;
  if (page) {
    if (!MAP[host].pages[page]) {
      var have = Object.keys(MAP[host].pages).join(" ");
      say("no page '" + page + "' on " + host + (have ? " (have: " + have + ")" : " (no pages)"), true);
      return false;
    }
    to = MAP[host].url.replace(/\/$/, "") + MAP[host].pages[page];
  }
  say("going to " + to + " …");
  setTimeout(function () { location.href = to; }, 180);
  return true;
}
function run(raw) {
  var v = String(raw || "").trim().replace(/\s+/g, " ");
  if (!v) return;
  var parts = v.toLowerCase().split(" "), verb = parts[0], a = parts[1] || "", b = parts[2] || "";
  if (verb === "log") {
    if (a === "in") return login();
    if (a === "out") return logout();
    say("usage: log in | log out", true); return;
  }
  if (verb === "go") {
    if (!authed()) { say("not logged in — run 'log in' first", true); return; }
    if (!a) { say("usage: go <vhost> [page] — " + Object.keys(MAP).join(" "), true); return; }
    go(a, b); return;
  }
  say("unknown command: " + v + " — try 'go <vhost>' or 'log in'", true);
}
function login() {
  say("authenticating …");
  fetch("/__tail/login", { credentials: "same-origin" }).then(function (r) {
    if (r.ok) { setAuthed(true); say("logged in — held until you run 'log out'"); }
    else { setAuthed(false); say("login cancelled or failed (" + r.status + ")", true); }
    cmd.focus();
  }).catch(function () { say("login failed", true); });
}
function logout() {
  setAuthed(false); say("logged out");
  setTimeout(function () { location.href = "https://logout:logout@" + location.host + "/"; }, 180);
}
cmd.addEventListener("input", function () { pick = -1; say(""); render(); });
cmd.addEventListener("keydown", function (ev) {
  var k = ev.key || "";
  if (k === "Enter" || ev.keyCode === 13) {
    ev.preventDefault();
    var v = cmd.value; cmd.value = ""; pick = -1; render(); say("");
    run(v);
  } else if (k === "Tab" || k === "ArrowRight") {
    var t = items[Math.max(0, pick)];
    if (t) { ev.preventDefault(); accept(t); }
  } else if (k === "ArrowDown") { if (items.length) { ev.preventDefault(); pick = (pick + 1) % items.length; render(); } }
  else if (k === "ArrowUp") { if (items.length) { ev.preventDefault(); pick = (pick <= 0 ? items.length : pick) - 1; render(); } }
  else if (k === "Escape") { cmd.value = ""; pick = -1; say(""); render(); }
});
line.addEventListener("mousedown", function (ev) { if (ev.target !== cmd) { ev.preventDefault(); cmd.focus(); } });
window.addEventListener("resize", fit);
cmd.focus(); render();
say(authed() ? "session active" : "read-only — run 'log in' to unlock 'go'");
</script>
</body>
</html>
