services:
  kuma:
    image: louislam/uptime-kuma:1
    container_name: uptimekuma
    restart: unless-stopped

    # Hard RAM cap (no container swap) — survives recreates, unlike `docker update`.
    mem_limit: 512m
    memswap_limit: 512m

    expose:
      - "3001"

    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:3001/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

    volumes:
      - /var/www/custom/projects/homelab/kuma/data:/app/data:rw
      # Read-only docker socket so Kuma can monitor running containers.
      # Risk: compromised Kuma container = host root. Kuma is a single-user
      # dashboard behind Tailscale + Cloudflare; acceptable for this setup.
      - /var/run/docker.sock:/var/run/docker.sock:ro

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    # Pin the bridge IP — services/vhosts/Caddyfile hardcodes
    # 172.22.0.6:3001 for the uptimekuma upstream.
    networks:
      net:
        ipv4_address: 172.22.0.6

networks:
  net:
    external: true
