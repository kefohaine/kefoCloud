services:
  vault:
    image: vaultwarden/server:latest
    container_name: vault
    restart: unless-stopped

    environment:
      DOMAIN: https://vault.jehpok.com
      SIGNUPS_ALLOWED: "false"
      INVITATIONS_ALLOWED: "false"
      SHOW_PASSWORD_HINT: "false"
      ROCKET_PORT: "80"

    volumes:
      - /var/www/github/jehpok.com/vault/data:/data

    expose:
      - "80"

    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost/alive"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    networks:
      - net

networks:
  net:
    external: true