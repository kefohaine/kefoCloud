services:
  webui:
    # Pinned by digest — `make update`'s compose pull stays a no-op until
    # the digest is bumped deliberately. Image revision d3e8bf3.
    image: ghcr.io/open-webui/open-webui@sha256:c792953395b43d4f49085fa4026850c5e923578345ebeaf56eabd980bcfc273a
    container_name: open-webui
    restart: unless-stopped

    # Hard RAM cap (no container swap) — survives recreates, unlike `docker update`.
    mem_limit: 2g
    memswap_limit: 2g

    expose:
      - "8080"

    environment:
      - WEBUI_NAME=fxmq.net AI
      # Auth: the single admin is auto-created from the WEBUI_ADMIN_* vars in
      # openwebui.env (first-user signup-as-admin is disabled). Signup is
      # closed via the admin settings after first boot. The vhost is
      # tailnet-only behind Caddy's @not_tailnet 403 — auth is the second
      # layer, not the first.
      - ENABLE_INITIAL_ADMIN_SIGNUP=false
      - ENABLE_VERSION_UPDATE_CHECK=false
      - ENABLE_WEBSOCKET_SUPPORT=true

    # OPENAI_API_BASE_URL / OPENAI_API_KEY (DeepSeek, same key as goose) and
    # WEBUI_SECRET_KEY / WEBUI_ADMIN_* live here — outside the repo, chmod
    # 0600, same pattern as caddy_data/CF_API_TOKEN.
    env_file:
      - /var/www/custom/projects/homelab/open-webui/openwebui.env

    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

    volumes:
      # Persistent app data: sqlite (users, chats, tools, settings), uploads.
      - /var/www/custom/projects/homelab/open-webui/data:/app/backend/data
      # SSH identity for the Host Shell tool (op@host, generated at setup;
      # public half appended to op's authorized_keys). Read-only.
      - /var/www/custom/projects/homelab/open-webui/keys:/keys:ro

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    # Pin the bridge IP — the shell.fxmq.net vhost hardcodes 172.22.0.7:8080.
    networks:
      net:
        ipv4_address: 172.22.0.7

networks:
  net:
    external: true
