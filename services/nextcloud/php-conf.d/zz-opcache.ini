; Opcache tuning for Nextcloud FPM.
;
; Nextcloud files (apps + core) change rarely. With validate_timestamps=0
; opcache never re-stats files, which saves the disk-hit on every request
; that the default revalidate_freq=60s pattern would otherwise cause.
; Trade-off: deploying new apps or upgrading Nextcloud requires
; `docker restart cloud` (the entrypoint picks them up) instead of being
; hot-reloaded. Acceptable for a single-operator install.
;
; These values are applied as defaults to the master process; per-pool
; overrides (e.g. from a [www] block) would still win if added later.

opcache.validate_timestamps=0

; JIT tracing is on by default in PHP 8.x but the buffer size defaults to
; 0 in many builds — pin it so the JIT is actually usable. 64M is plenty
; for Nextcloud's request mix (small files, lots of string work).
opcache.jit_buffer_size=64M

; Memory pool sized for the actual Nextcloud + apps file count. The image
; default of 128M is wasteful on a 3.7G host.
opcache.memory_consumption=96
opcache.interned_strings_buffer=16

; 10000 is the image default but Nextcloud alone exceeds that once you
; count the apps shipped in the image. Bump to 20000 (the next power of 2
; in the hashtable sizing — opcache rounds internally).
opcache.max_accelerated_files=20000

; Aggressive reclamation on request end. Saves a few MB of resident set
; at zero cost.
opcache.fast_shutdown=1

; save_comments must stay on — Nextcloud annotations / Doctrine / apps
; rely on doc-comments for reflection.
; opcache.save_comments=1 (image default, leave it)
