; PHP sessions in Redis (phpredis session handler).
;
; Kept in the repo + bind-mounted (see docker-compose.yml) so a container
; recreate keeps the handler. The image otherwise defaults to file sessions
; under /tmp, which are lost on every recreate — Redis keeps its own container,
; so sessions outlive a restart/recreate of the nextcloud container.
;
; Locking stops two FPM workers from writing the same session concurrently
; (the recommended Redis-session setup). lock_retries=-1 = retry until the lock
; is free, lock_wait_time 10000 ms between attempts.

session.save_handler = redis
session.save_path = "tcp://redis:6379"
redis.session.locking_enabled = 1
redis.session.lock_retries = -1
redis.session.lock_wait_time = 10000
