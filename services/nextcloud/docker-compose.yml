services:
  cloud:
    image: nextcloud:34.0.2-fpm
    container_name: nextcloud
    restart: unless-stopped

    # Hard RAM cap (no container swap) — survives recreates, unlike `docker update`.
    # The whole stack (nextcloud+redis+signaling+coturn+db) stays under the
    # operator's 3 GB ceiling: 1g+192m+256m+128m+768m = 2.34g.
    mem_limit: 1g
    memswap_limit: 1g

    # No published ports — only Caddy (on the 'net' bridge) reaches this container.
    # If you ever need to debug from the host: `docker exec -it nextcloud bash`.
    expose:
      - "9000"

    healthcheck:
      test: ["CMD-SHELL", "php -r 'echo phpversion();' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

    depends_on:
      - redis

    volumes:
      # Nextcloud html root (3rdparty, core, apps, config, occ).
      # chown -R 33:33 /var/www/custom/projects/homelab/cloud/html BEFORE first start.
      - /var/www/custom/projects/homelab/cloud/html:/var/www/html:rw
      # User files datadirectory (appdata_*, <user>/, owncloud.db, nextcloud.log).
      # Mounted at /data (not /var/www/html/data) to avoid a nested bind mount
      # inside the /var/www/html volume — the Nextcloud image declares
      # VOLUME ["/var/www/html"], which makes nested bind mounts fragile and
      # can silently detach after long uptimes or daemon events.
      # 'datadirectory' in config.php must point to /data.
      - /var/www/custom/projects/homelab/cloud/users:/data:rw
      # Persistent PHP-FPM pool configuration
      - ./php-fpm.d/zz-custom.conf:/usr/local/etc/php-fpm.d/zz-custom.conf:ro
      # Persistent opcache tuning. Dropped into conf.d so it survives image
      # upgrades; zz- prefix so it loads last (overrides anything earlier).
      - ./php-conf.d/zz-opcache.ini:/usr/local/etc/php/conf.d/zz-opcache.ini:ro

    environment:
      # Database: PostgreSQL. For now the db container runs on this host
      # (docker-compose.db.yml, bridge IP 172.22.0.15); when the operator's
      # 1 TB VPS joins the tailnet, move pgdata + that compose file there and
      # set POSTGRES_HOST to its tailnet IP (see docs/GUIDE.md "Nextcloud DB").
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: ${POSTGRES_HOST}
      # Redis distributed cache + file locking — the entrypoint writes these
      # into config.php (memcache.distributed / memcache.locking) at install.
      REDIS_HOST: ${REDIS_HOST}
      NEXTCLOUD_ADMIN_USER: ${NEXTCLOUD_ADMIN_USER}
      NEXTCLOUD_ADMIN_PASSWORD: ${NEXTCLOUD_ADMIN_PASSWORD}
      NEXTCLOUD_OVERWRITEPROTOCOL: https
      NEXTCLOUD_TRUSTED_DOMAINS: "cloud.fxmq.net"
      NEXTCLOUD_DATA_DIR: /data
      # Caddy's 'net' subnet (172.22.0.0/16) + Cloudflare edge IPs so Nextcloud
      # sees the real client IP (CF-Connecting-IP) instead of Caddy's. Required
      # for the brute-force throttle to work and to satisfy the "Forwarded for
      # headers" setup check. Cloudflare ranges sourced from cloudflare.com/ips.
      TRUSTED_PROXIES: "172.22.0.0/16,173.245.48.0/20,103.21.244.0/22,103.22.200.0/22,103.31.4.0/22,141.101.64.0/18,108.162.192.0/18,190.93.240.0/20,188.114.96.0/20,197.234.240.0/22,198.41.128.0/17,162.158.0.0/15,104.16.0.0/13,104.24.0.0/14,172.64.0.0/13,131.0.72.0/22,2400:cb00::/32,2606:4700::/32,2803:f800::/32,2405:b500::/32,2405:8100::/32,2a06:98c0::/29,2c0f:f248::/32"
      OVERWRITECLIURL: "https://cloud.fxmq.net"

    extra_hosts:
      # Map the cert FQDN to the mail container's bridge IP so the Mail app
      # and Nextcloud's SMTP see mail.fxmq.net with matching SNI + LE cert
      # (same pattern as the roundcube container). The Mail app authenticates
      # per-user mailboxes; NC's own outbound uses nextcloud@fxmq.net.
      - "mail.fxmq.net:172.22.0.9"

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    # Pin the bridge IP — services/vhosts/Caddyfile php_fastcgi upstream
    # is 172.22.0.5:9000.
    networks:
      net:
        ipv4_address: 172.22.0.5

  # ── Nextcloud Talk support stack ──────────────────────────────────────────
  # redis: distributed cache + locking (see REDIS_HOST above).
  # signaling: Talk High Performance Backend (strukturag/nextcloud-spreed-
  #   signaling, the official Go server — no NATS needed). Config generated
  #   by `make talk-gen` into /var/www/custom/projects/homelab/talk/.
  # coturn: TURN/STUN for WebRTC call media; turn.fxmq.net:3478/5349 + relay.

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    mem_limit: 192m
    memswap_limit: 192m
    # Pure cache: no persistence, LRU eviction at 128 MB. Locks live here too —
    # losing them on restart is harmless (they are ephemeral by design).
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      net:
        ipv4_address: 172.22.0.11

  signaling:
    image: strukturag/nextcloud-spreed-signaling:latest
    container_name: talk-signaling
    restart: unless-stopped
    mem_limit: 256m
    memswap_limit: 256m
    volumes:
      # Rendered by `make talk-gen` (gitignored runtime dir, sibling of repo/).
      - /var/www/custom/projects/homelab/talk/server.conf:/config/server.conf:ro
    extra_hosts:
      # The signaling server validates client sessions by calling back into
      # Nextcloud ([backend1] urls = https://cloud.fxmq.net). Route that
      # directly to Caddy on the host bridge (172.22.0.1) instead of the
      # public DNS → Cloudflare proxy path: one less hop and immune to CF
      # Bot Fight Mode challenging the server's requests (same pattern as
      # the roundcube container's extra_hosts). SNI/cert still match.
      - "cloud.fxmq.net:172.22.0.1"
    healthcheck:
      test: ["CMD-SHELL", "timeout 3 bash -c '</dev/tcp/127.0.0.1/8080' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      net:
        ipv4_address: 172.22.0.12

  coturn:
    image: coturn/coturn:4.6
    container_name: talk-coturn
    restart: unless-stopped
    # The image defaults to uid nobody, which cannot read the TURN secret
    # conf (0600) or the caddy_data LE certs (uid 201). turnserver as root is
    # the standard deployment (same pattern as the mailserver reading
    # caddy_data); it still only relays for clients holding a TURN credential.
    user: "0:0"
    mem_limit: 128m
    memswap_limit: 128m
    ports:
      - "3478:3478/udp"
      - "3478:3478/tcp"
      - "5349:5349/tcp"
      - "49160-49200:49160-49200/udp"
      - "49160-49200:49160-49200/tcp"
    command: ["-c", "/etc/coturn/turnserver.conf", "--log-file=stdout", "--external-ip=$(detect-external-ip)"]
    # Real STUN round-trip on 3478 (the image ships turnutils_stunclient;
    # a bare TCP connect would pass while the TURN/STUN stack is broken).
    healthcheck:
      test: ["CMD", "turnutils_stunclient", "127.0.0.1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    volumes:
      # Rendered by `make talk-gen`. Static-auth-secret must match the
      # `occ talk:turn:add --secret` used in Nextcloud.
      - /var/www/custom/projects/homelab/talk/turnserver.conf:/etc/coturn/turnserver.conf:ro
      # Reuse the turn.fxmq.net LE cert (issued by Caddy via DNS-01) for TURNS
      # on 5349 — same pattern as the mailserver's cert reuse.
      - /var/www/custom/projects/homelab/caddy_data:/caddy:ro
    networks:
      net:
        ipv4_address: 172.22.0.14

networks:
  net:
    external: true
