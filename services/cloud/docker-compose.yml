services:
  cloud:
    image: nextcloud:34.0.2-fpm
    container_name: cloud
    restart: unless-stopped

    # No published ports — only Caddy (on the 'net' bridge) reaches this container.
    # If you ever need to debug from the host: `docker exec -it cloud bash`.
    expose:
      - "9000"

    healthcheck:
      test: ["CMD-SHELL", "php -r 'echo phpversion();' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

    volumes:
      # Nextcloud html root (3rdparty, core, apps, config, occ).
      # chown -R 33:33 /var/www/custom/projects/jehpok/cloud/html BEFORE first start.
      - /var/www/custom/projects/jehpok/cloud/html:/var/www/html:rw
      # User files datadirectory (appdata_*, <user>/, owncloud.db, nextcloud.log).
      # Mounted at /data (not /var/www/html/data) to avoid a nested bind mount
      # inside the /var/www/html volume — the Nextcloud image declares
      # VOLUME ["/var/www/html"], which makes nested bind mounts fragile and
      # can silently detach after long uptimes or daemon events.
      # 'datadirectory' in config.php must point to /data.
      - /var/www/custom/projects/jehpok/cloud/users:/data:rw
      # Persistent PHP-FPM pool configuration
      - ./php-fpm.d/zz-custom.conf:/usr/local/etc/php-fpm.d/zz-custom.conf:ro
      # Persistent opcache tuning. Dropped into conf.d so it survives image
      # upgrades; zz- prefix so it loads last (overrides anything earlier).
      - ./php-conf.d/zz-opcache.ini:/usr/local/etc/php/conf.d/zz-opcache.ini:ro

    environment:
      # With no MYSQL_/POSTGRES_ vars set, the official image's entrypoint
      # auto-creates db/owncloud.db (SQLite) inside the data volume.
      # Admin credentials are read from .env (gitignored). Nextcloud is
      # already installed; these are only used on first init.
      NEXTCLOUD_ADMIN_USER: ${NEXTCLOUD_ADMIN_USER}
      NEXTCLOUD_ADMIN_PASSWORD: ${NEXTCLOUD_ADMIN_PASSWORD}
      NEXTCLOUD_OVERWRITEPROTOCOL: https
      NEXTCLOUD_TRUSTED_DOMAINS: "cloud.jehpok.com"
      # Caddy's 'net' subnet (172.22.0.0/16) + Cloudflare edge IPs so Nextcloud
      # sees the real client IP (CF-Connecting-IP) instead of Caddy's. Required
      # for the brute-force throttle to work and to satisfy the "Forwarded for
      # headers" setup check. Cloudflare ranges sourced from cloudflare.com/ips.
      TRUSTED_PROXIES: "172.22.0.0/16,173.245.48.0/20,103.21.244.0/22,103.22.200.0/22,103.31.4.0/22,141.101.64.0/18,108.162.192.0/18,190.93.240.0/20,188.114.96.0/20,197.234.240.0/22,198.41.128.0/17,162.158.0.0/15,104.16.0.0/13,104.24.0.0/14,172.64.0.0/13,131.0.72.0/22,2400:cb00::/32,2606:4700::/32,2803:f800::/32,2405:b500::/32,2405:8100::/32,2a06:98c0::/29,2c0f:f248::/32"
      OVERWRITECLIURL: "https://cloud.jehpok.com"

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    # Pin the bridge IP — services/domain/Caddyfile php_fastcgi upstream
    # is 172.22.0.5:9000.
    networks:
      net:
        ipv4_address: 172.22.0.5

networks:
  net:
    external: true