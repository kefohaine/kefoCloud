services:
  cloud:
    image: nextcloud:34.0.2-fpm
    container_name: cloud
    restart: unless-stopped

    # No published ports — only Caddy (on the 'net' bridge) reaches this container.
    # If you ever need to debug from the host: `docker exec -it cloud bash`.
    expose:
      - "9000"

    healthcheck:
      test: ["CMD-SHELL", "php -r 'echo phpversion();' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

    volumes:
      # Nextcloud html root (3rdparty, core, apps, config, occ).
      # chown -R 33:33 /var/www/github/jehpok.com/cloud/html BEFORE first start.
      - /var/www/github/jehpok.com/cloud/html:/var/www/html:rw
      # User files datadirectory (appdata_*, <user>/, owncloud.db, nextcloud.log).
      # Matches 'datadirectory' => '/var/www/html/data' in config.php.
      - /var/www/github/jehpok.com/cloud/users:/var/www/html/data:rw
      # Persistent PHP-FPM pool configuration
      - ./php-fpm.d/zz-custom.conf:/usr/local/etc/php-fpm.d/zz-custom.conf:ro

    environment:
      # With no MYSQL_/POSTGRES_ vars set, the official image's entrypoint
      # auto-creates db/owncloud.db (SQLite) inside the data volume.
      # Admin credentials are read from .env (gitignored). Nextcloud is
      # already installed; these are only used on first init.
      NEXTCLOUD_ADMIN_USER: ${NEXTCLOUD_ADMIN_USER}
      NEXTCLOUD_ADMIN_PASSWORD: ${NEXTCLOUD_ADMIN_PASSWORD}
      NEXTCLOUD_OVERWRITEPROTOCOL: https
      NEXTCLOUD_TRUSTED_DOMAINS: "cloud.jehpok.com"
      TRUSTED_PROXIES: "172.22.0.0/16"
      OVERWRITECLIURL: "https://cloud.jehpok.com"

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    networks:
      - net

networks:
  net:
    external: true