[www]

; ondemand is right for Nextcloud: a single user (the operator) hitting the
; web UI occasionally. dynamic would keep a couple of workers idle-spinning
; forever. max_children=8 is well above what 1 user actually opens in parallel.
pm = ondemand
pm.max_children = 8
pm.process_idle_timeout = 10s
pm.max_requests = 400
request_terminate_timeout = 200s

; Opcache lives in its own .ini under conf.d so the [www] pool file stays
; strictly FPM directives. See php-conf.d/zz-opcache.ini for the cache
; tuning (validate_timestamps=0, JIT buffer, file count).
