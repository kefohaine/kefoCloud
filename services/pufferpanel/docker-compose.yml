services:
  pufferpanel:
    image: pufferpanel/pufferpanel:latest
    container_name: pufferpanel
    restart: unless-stopped

    # Hard RAM cap (no container swap) — survives recreates, unlike `docker update`.
    mem_limit: 256m
    memswap_limit: 256m

    # Web UI on 8080, built-in SFTP on 5657 (file manager for servers).
    # Exposed on the `net` bridge only — no host port publish, no Caddy
    # vhost yet (no hostname assigned by the operator). Reachable from
    # the host at http://172.22.0.8:8080 until a route is chosen.
    expose:
      - "8080"
      - "5657"

    # Image has wget but not curl; check the web UI on 8080.
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

    volumes:
      - /var/www/custom/projects/homelab/puffer/data:/var/lib/pufferpanel
      - /var/www/custom/projects/homelab/puffer/config:/etc/pufferpanel
      # PufferPanel's daemon needs the Docker socket to run game servers.
      # Risk: compromised panel = host root. Same trade-off as uptimekuma's
      # socket mount; required for the panel to start at all.
      - /var/run/docker.sock:/var/run/docker.sock

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    networks:
      net:
        ipv4_address: 172.22.0.8

networks:
  net:
    external: true
