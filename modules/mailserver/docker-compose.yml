x-mailu-env: &mailu-env
  env_file: .env
  environment:
    # Mailu's hostname is mail.${DOMAIN}: the same name Caddy serves the
    # platform door on and the one whose cert signs SMTP/IMAP
    # (TLS_FLAVOR=mail below). The webmail lives on its own door,
    # cube.${DOMAIN} (container `roundcube`).
    HOSTNAMES: "mail.${DOMAIN}"
    # The mail cache is `mailu-redis`, NOT `redis`: both compose files join the
    # same external `net` bridge, so a service named `redis` published a second
    # `redis` DNS alias next to the Nextcloud cache. Inside the cloud container
    # the name resolved to both IPs, phpredis round-robined onto Mailu's
    # instance and every session SET hung on its MISCONF error (2026-10-19:
    # cloud.fxmq.net timed out with HTTP 000 while `occ status` was fine).
    REDIS_ADDRESS: "mailu-redis"
    # The front's jinja template (/conf/nginx.conf in the image) emits
    # `location {{ WEB_ADMIN }}` only inside `{% if ADMIN %}`, and it takes
    # WEB_ADMIN/WEBROOT_REDIRECT straight from the environment — neither is
    # defaulted by /config.py. Unset, the rendered config had no admin route at
    # all and `/` fell through to `try_files $uri =404`, so the platform door
    # answered 404 for every path (2026-10-19). ADMIN_ADDRESS alone is not
    # enough: it only feeds `set $admin {{ ADMIN_ADDRESS }}:8080;`.
    ADMIN: "true"
    WEB_ADMIN: "/admin"
    WEBROOT_REDIRECT: "/admin"

services:
  # ── Mailu (front + postfix + dovecot + rspamd + admin) ────────────────────
  # Replaces the single-container Docker Mailserver. Mailu splits the roles:
  # `front` owns the public ports and TLS, `smtp`/`imap` speak the protocols on
  # the bridge, `antispam` is Rspamd, `admin` holds the SQLite config + CLI.
  # `webmail` is deliberately NOT started: Roundcube stays the webmail and is
  # served by Caddy at cube.${DOMAIN} (container `roundcube` below). Mailu owns
  # mail.${DOMAIN} — web door, admin UI at /admin, and the SMTP/IMAP cert. That
  # door is TAILNET-ONLY (no public A record, @not_tailnet 403 in
  # modules/caddy/vhosts/mail.caddy); the listeners below are still published on
  # the host, so tailnet members reach them by name and nobody else by DNS.
  #
  # TLS_FLAVOR=mail: no HTTP listener in front (Caddy owns 80/443 on the host);
  # SMTP/IMAP use the per-vhost LE cert for mail.${DOMAIN} from caddy_data,
  # mounted as /certs/cert.pem + /certs/key.pem — the front's own hostname, so
  # SNI and the cert CN match.
  front:
    image: ghcr.io/mailu/nginx:2.0
    container_name: mailu-front
    restart: unless-stopped
    <<: *mailu-env
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    mem_limit: 256m
    memswap_limit: 256m
    ports:
      - "25:25"
      - "465:465"
      - "587:587"
      - "993:993"
    volumes:
      - ${DATA_DIR}/mailserver/certs:/certs:ro
      - ${DATA_DIR}/mailserver/overrides/nginx:/overrides:ro
    depends_on:
      - mailu-redis
      - imap
      - smtp
      - admin
      - antispam
    healthcheck:
      # The mailu nginx image ships no `ss`, `nc`, `grep` or `awk` — only shell
      # builtins — so the probe reads /proc/net/tcp directly: state 0A is
      # LISTEN, and the hex ports are 25/465/587/993. (2026-10-19: the old
      # `ss | grep` test reported the container unhealthy forever.)
      test: ["CMD-SHELL", "while read -r sl l r s rest; do [ \"$$s\" = 0A ] || continue; case \"$$l\" in *:0019|*:01D1|*:024B|*:03E1) exit 0;; esac; done < /proc/net/tcp; exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      net:
        ipv4_address: 172.22.0.9

  imap:
    image: ghcr.io/mailu/dovecot:2.0
    container_name: mailu-imap
    restart: unless-stopped
    <<: *mailu-env
    mem_limit: 256m
    memswap_limit: 256m
    volumes:
      - ${DATA_DIR}/mailserver/mail:/mail
      - ${DATA_DIR}/mailserver/overrides/dovecot:/overrides:ro
    networks:
      net:
        ipv4_address: 172.22.0.17

  smtp:
    image: ghcr.io/mailu/postfix:2.0
    container_name: mailu-smtp
    restart: unless-stopped
    <<: *mailu-env
    mem_limit: 256m
    memswap_limit: 256m
    volumes:
      - ${DATA_DIR}/mailserver/mail:/mail
      - ${DATA_DIR}/mailserver/overrides/postfix:/overrides:ro
    networks:
      net:
        ipv4_address: 172.22.0.18

  antispam:
    image: ghcr.io/mailu/rspamd:2.0
    container_name: mailu-antispam
    restart: unless-stopped
    <<: *mailu-env
    mem_limit: 256m
    memswap_limit: 256m
    volumes:
      - ${DATA_DIR}/mailserver/filter:/var/lib/rspamd
      - ${DATA_DIR}/mailserver/dkim:/dkim
      - ${DATA_DIR}/mailserver/overrides/rspamd:/overrides:ro
    networks:
      net:
        ipv4_address: 172.22.0.19

  admin:
    image: ghcr.io/mailu/admin:2.0
    container_name: mailu-admin
    restart: unless-stopped
    <<: *mailu-env
    mem_limit: 256m
    memswap_limit: 256m
    volumes:
      - ${DATA_DIR}/mailserver/data:/data
      - ${DATA_DIR}/mailserver/dkim:/dkim
    # Admin UI is not published: reach it over the tailnet/SSH tunnel
    # (`ssh -L 8081:127.0.0.1:8081 root@$NODE_NAME`). Caddy keeps 80/443.
    ports:
      - "127.0.0.1:8081:80"
    networks:
      net:
        ipv4_address: 172.22.0.20

  mailu-redis:
    image: redis:8-alpine
    container_name: mailu-redis
    restart: unless-stopped
    <<: *mailu-env
    mem_limit: 128m
    memswap_limit: 128m
    volumes:
      - ${DATA_DIR}/mailserver/redis:/data
    networks:
      net:
        ipv4_address: 172.22.0.21

  roundcube:
    # Webmail for the mail platform: Caddy serves it at cube.${DOMAIN}.
    # IMAP/SMTP point at Mailu's imap/smtp containers.
    image: roundcube/roundcubemail:1.7.4-apache
    container_name: roundcube
    restart: unless-stopped

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

    mem_limit: 384m
    memswap_limit: 384m

    environment:
      ROUNDCUBEMAIL_DB_TYPE: sqlite
      ROUNDCUBEMAIL_DEFAULT_HOST: mailu-imap
      ROUNDCUBEMAIL_DEFAULT_PORT: 143
      ROUNDCUBEMAIL_SMTP_SERVER: mailu-smtp
      ROUNDCUBEMAIL_SMTP_PORT: 587
      ROUNDCUBEMAIL_USERNAME_DOMAIN: ${DOMAIN}

    volumes:
      - ${DATA_DIR}/mailserver/roundcube:/var/roundcube/db
      - ${DATA_DIR}/rendered/mailserver/roundcube-tls.inc.php:/var/roundcube/config/roundcube-tls.inc.php:ro

    extra_hosts:
      # The platform FQDN → mailu-front, so roundcube's tls://mail.${DOMAIN}
      # STARTTLS path (modules/mailserver/roundcube-tls.inc.php) matches both
      # the SNI and the cert.
      - "mail.${DOMAIN}:172.22.0.9"

    networks:
      net:
        ipv4_address: 172.22.0.10

networks:
  net:
    external: true
