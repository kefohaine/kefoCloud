services:
  domain:
    build:
      context: .
      dockerfile: Dockerfile
    image: caddy:local
    container_name: caddy
    restart: unless-stopped

    # Hard RAM cap (no container swap) — survives recreates, unlike `docker update`.
    mem_limit: 128m
    memswap_limit: 128m

    # Host network so Caddy sees the real client source IP — without it,
    # Docker DNAT rewrites every packet to 172.22.0.1 (the bridge gateway)
    # before Caddy sees it, which breaks the @not_tailnet remote_ip matcher
    # on https://tail.${DOMAIN}. The host network namespace is on the
    # `net` bridge at 172.22.0.0/16, so Caddy can still reach upstream
    # containers by their bridge IP (172.22.0.4 .. .15 — see Caddyfile).
    network_mode: host

    healthcheck:
      test: ["CMD", "caddy", "version"]
      interval: 30s
      timeout: 5s
      retries: 3

    volumes:
      - ${DATA_DIR}/cloud/html:/nextcloud:ro
      # homelab/download — the www.${DOMAIN}/download file browser's root
      # (drop files here; Caddy serves them read-only).
      - ${DATA_DIR}/download:/download:ro
      # Top-level Caddyfile + per-vhost snippets, as RENDERED by `make render`
      # from the tracked skeleton. Mount the tracked dir by mistake and Caddy
      # happily loads site blocks for a literal 'www.{{DOMAIN}}' — it starts,
      # listens, and serves nothing (2026-09-22). The dir is mounted so the
      # `import` directives resolve relative paths (Caddy treats imports as
      # relative to the importing file).
      - ${DATA_DIR}/rendered/caddy:/etc/caddy:ro
      # The web root is INSTANCE DATA, not repo content: every page served by
      # www.${DOMAIN} and tail.${DOMAIN} lives in ${DATA_DIR}/www (operator-
      # edited; targets.json is generated there). Nested inside the mount
      # above on purpose — the skeleton ships no pages at all.
      - ${DATA_DIR}/www:/etc/caddy/www:ro
      # Persistent Caddy data: ACME certs, account keys, OCSP staples.
      # Bound at /data, which is the caddy:2.x default base directory —
      # the built-in ACME issuer writes under /data/caddy and renewal
      # simply updates the same files, so the cert survives a container
      # recreate. Without this bind every `make d-recreate-${DOMAIN}` would force
      # a fresh issuance and a 90-day clock restart.
      - ${DATA_DIR}/caddy_data:/data

    # Cloudflare API token for ACME DNS-01. Sourced from a host file
    # (chmod 0600, owner uid 201 = caddy) so the literal token never
    # lives in the compose file or the repo. `docker compose` exports
    # every KEY=VAL line into the container's env at start, so the
    # `env.CF_API_TOKEN` reference in the Caddyfile resolves at runtime.
    env_file:
      - ${DATA_DIR}/caddy_data/CF_API_TOKEN

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
