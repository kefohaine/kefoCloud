services:
  matrix-db:
    image: postgres:17-alpine
    container_name: matrix-db
    restart: unless-stopped

    # Hard RAM cap (no container swap) — survives recreates, unlike `docker update`.
    mem_limit: 384m
    memswap_limit: 384m

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: "--data-checksums --locale=C --encoding=UTF8"
      TZ: ${TIMEZONE}

    volumes:
      - ${DATA_DIR}/matrix/pgdata:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    # Pin the bridge IP — the edge dials 172.22.0.30:5432 by address.
    networks:
      net:
        ipv4_address: 172.22.0.30

  matrix-synapse:
    image: matrixdotorg/synapse:v1.118.0
    container_name: matrix-synapse
    restart: unless-stopped

    mem_limit: 768m
    memswap_limit: 768m

    environment:
      SYNAPSE_CONFIG_PATH: /data/homeserver.yaml
      SYNAPSE_NO_TLS: "1"
      TZ: ${TIMEZONE}

    volumes:
      # homeserver.yaml, log.config, the signing key and the media store.
      # Generated by `make matrix-gen` (scripts/modules/matrix-gen.sh).
      - ${DATA_DIR}/matrix/synapse:/data

    depends_on:
      matrix-db:
        condition: service_healthy

    expose:
      - "8008"

    healthcheck:
      # The image is python-based and ships no curl; urllib is always there.
      test: ["CMD", "python3", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8008/health').status == 200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    networks:
      net:
        ipv4_address: 172.22.0.28

  matrix-element:
    image: vectorim/element-web:v1.12.0
    container_name: matrix-element
    restart: unless-stopped

    mem_limit: 128m
    memswap_limit: 128m

    volumes:
      # Element's runtime config: the homeserver URL, branding and the room
      # directory. Generated by `make matrix-gen`.
      - ${DATA_DIR}/matrix/element/config.json:/app/config.json:ro

    expose:
      - "80"

    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    networks:
      net:
        ipv4_address: 172.22.0.29

  matrix-mas-db:
    image: postgres:17-alpine
    container_name: matrix-mas-db
    restart: unless-stopped

    mem_limit: 256m
    memswap_limit: 256m

    environment:
      POSTGRES_DB: mas
      POSTGRES_USER: mas
      POSTGRES_PASSWORD: ${MAS_DB_PASSWORD}
      TZ: ${TIMEZONE}

    volumes:
      - ${DATA_DIR}/matrix/mas-pgdata:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mas -d mas"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    networks:
      net:
        ipv4_address: 172.22.0.33

  matrix-mas:
    image: ghcr.io/element-hq/matrix-authentication-service:0.14.1
    container_name: matrix-mas
    restart: unless-stopped

    mem_limit: 384m
    memswap_limit: 384m

    environment:
      TZ: ${TIMEZONE}

    # The image is distroless: mas-cli IS the entrypoint, so the server runs as
    # an argument. It applies pending database migrations on start.
    command: ["server", "-c", "/data/config.yaml"]

    volumes:
      # config.yaml + the token-signing keys, generated once by `make matrix-gen`.
      - ${DATA_DIR}/matrix/mas:/data:ro

    depends_on:
      matrix-mas-db:
        condition: service_healthy

    expose:
      - "8080"

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    networks:
      net:
        ipv4_address: 172.22.0.34

networks:
  net:
    external: true
