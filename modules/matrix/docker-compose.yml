services:
  matrix-db:
    image: postgres:17-alpine
    container_name: matrix-db
    restart: unless-stopped

    # Hard RAM cap (no container swap) — survives recreates, unlike `docker update`.
    mem_limit: 384m
    memswap_limit: 384m

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: "--data-checksums --locale=C --encoding=UTF8"
      TZ: ${TIMEZONE}

    volumes:
      - ${DATA_DIR}/matrix/pgdata:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    # Pin the bridge IP so the address is stable and never collides with
    # another module — nothing dials it by address.
    networks:
      net:
        ipv4_address: 172.22.0.30

  matrix-synapse:
    # The floor is set by MAS, not by taste: the service supports Synapse
    # 1.136.0 or later, and /_matrix/client/v1/auth_metadata — the route a
    # client and the admin panel read to find the issuer — arrived in 1.123.0.
    image: matrixdotorg/synapse:v1.164.2
    container_name: matrix-synapse
    restart: unless-stopped

    mem_limit: 768m
    memswap_limit: 768m

    environment:
      SYNAPSE_CONFIG_PATH: /data/homeserver.yaml
      SYNAPSE_NO_TLS: "1"
      TZ: ${TIMEZONE}

    volumes:
      # homeserver.yaml, log.config, the signing key and the media store.
      # Generated by `make matrix-gen` (scripts/modules/matrix-gen.sh).
      - ${DATA_DIR}/matrix/synapse:/data

    depends_on:
      matrix-db:
        condition: service_healthy
      matrix-mas:
        condition: service_healthy

    expose:
      - "8008"

    healthcheck:
      # The image is python-based and ships no curl; urllib is always there.
      test: ["CMD", "python3", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8008/health').status == 200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    networks:
      net:
        ipv4_address: 172.22.0.28

  matrix-element:
    image: vectorim/element-web:v1.12.33
    container_name: matrix-element
    restart: unless-stopped

    mem_limit: 128m
    memswap_limit: 128m

    volumes:
      # Element's runtime config: the homeserver URL, branding and the room
      # directory. Generated by `make matrix-gen`.
      - ${DATA_DIR}/matrix/element/config.json:/app/config.json:ro

    expose:
      - "80"

    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    networks:
      net:
        ipv4_address: 172.22.0.29

  matrix-mas-db:
    image: postgres:17-alpine
    container_name: matrix-mas-db
    restart: unless-stopped

    mem_limit: 256m
    memswap_limit: 256m

    environment:
      POSTGRES_DB: mas
      POSTGRES_USER: mas
      POSTGRES_PASSWORD: ${MAS_DB_PASSWORD}
      TZ: ${TIMEZONE}

    volumes:
      - ${DATA_DIR}/matrix/mas-pgdata:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mas -d mas"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    networks:
      net:
        ipv4_address: 172.22.0.33

  matrix-mas:
    # The floor is set by the delegated-auth contract: Synapse sends its shared
    # secret as a Bearer token to /oauth2/introspect, which MAS only accepts
    # from 0.20.0 — on 0.14.x every MAS-minted token answers 503 at Synapse.
    image: ghcr.io/element-hq/matrix-authentication-service:1.28.0
    container_name: matrix-mas
    restart: unless-stopped

    mem_limit: 384m
    memswap_limit: 384m

    environment:
      TZ: ${TIMEZONE}

    # The image is distroless: mas-cli IS the entrypoint, so the server runs as
    # an argument. It applies pending database migrations on start.
    command: ["server", "-c", "/data/config.yaml"]

    volumes:
      # config.yaml + the token-signing keys, generated once by `make matrix-gen`.
      - ${DATA_DIR}/matrix/mas:/data:ro

    depends_on:
      matrix-mas-db:
        condition: service_healthy

    expose:
      - "8080"

    healthcheck:
      # Distroless: mas-cli is the only binary. `config check` validates the
      # mounted config as uid 65532, which is what fails first on a key or
      # ownership mistake; readiness is then the migration + listener.
      test: ["CMD", "/usr/local/bin/mas-cli", "config", "check", "-c", "/data/config.yaml"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    networks:
      net:
        ipv4_address: 172.22.0.34

  # Element Admin — the ESS CE administration panel, part of this module by
  # default. It is a static SPA that reads the homeserver name and then calls
  # Synapse's and MAS's admin APIs from the browser, so it needs no config of
  # its own beyond the server name. Only the edge's tailnet-gated door
  # (modules/caddy/vhosts/admin.matrix.caddy) exposes it.
  element-admin:
    image: oci.element.io/element-admin:0.1.18
    container_name: element-admin
    restart: unless-stopped

    # Hard RAM cap (no container swap) — survives recreates, unlike `docker update`.
    mem_limit: 64m
    memswap_limit: 64m

    environment:
      TZ: ${TIMEZONE}
      # The homeserver NAME (the user-id suffix), not the panel's own hostname:
      # the app derives the Synapse and MAS endpoints from it.
      SERVER_NAME: matrix.${DOMAIN}

    expose:
      - "8080"

    # The image is a static nginx build: it only ever writes to /tmp. A
    # read-only rootfs keeps a compromised panel from persisting anything.
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run

    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    networks:
      net:
        ipv4_address: 172.22.0.32

  # ── Element Call (MatrixRTC / MSC4143) ──────────────────────────────────
  # The call stack: a LiveKit SFU for the media, the SFU's JWT service (it
  # trades a Matrix OpenID token for a LiveKit token, which is how a remote
  # user is kept out), and Element Call itself as a static app. Element Web
  # embeds call.matrix.$DOMAIN in an iframe; Element Call reads the SFU from
  # homeserver.yaml's `matrix_rtc.transports`, so neither app carries the
  # LiveKit address itself.
  livekit:
    # Pinned by digest: this repo publishes no semver tag, and `latest` is a
    # nightly. The label names the version the digest was cut from.
    image: livekit/livekit-server:v1.13.11@sha256:25cd902de7cacbd5f1f779f6a6ac1eae20ba8f56b0935934ce6b0ab80d1e3d20
    container_name: livekit
    restart: unless-stopped

    # Hard RAM cap (no container swap) — survives recreates, unlike `docker update`.
    mem_limit: 512m
    memswap_limit: 512m

    command: ["--config", "/etc/livekit.yaml"]
    volumes:
      # API key/secret and the RTC port map. 0600 on the host: the key is the
      # only thing standing between a stranger and the SFU.
      - ${DATA_DIR}/call/livekit.yaml:/etc/livekit.yaml:ro

    # WebRTC media, not web traffic: it cannot go through Caddy, and Cloudflare
    # is not in the path. UDP 7882 is the single muxed media port; TCP 7881 is
    # the fallback for networks that drop UDP. Both are opened by the
    # installer's firewall task and are what makes a call work off-tailnet.
    ports:
      - "7881:7881/tcp"
      - "7882:7882/udp"

    healthcheck:
      test: ["CMD", "/livekit-server", "--version"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    networks:
      net:
        ipv4_address: 172.22.0.35

  livekit-jwt:
    image: ghcr.io/element-hq/lk-jwt-service@sha256:d210fd778ba38b7e42e6fc64e8a24a7d66ccc3b938fb20d73bd713224af2dfea
    container_name: livekit-jwt
    restart: unless-stopped

    mem_limit: 64m
    memswap_limit: 64m

    environment:
      TZ: ${TIMEZONE}
      # The address a browser dials for signalling, and the SFU credentials
      # used to sign the short-lived token it hands back.
      LIVEKIT_URL: wss://livekit.matrix.${DOMAIN}
      LIVEKIT_KEY: ${LIVEKIT_KEY}
      LIVEKIT_SECRET: ${LIVEKIT_SECRET}
      # The only homeserver whose users may mint an SFU token.
      LIVEKIT_FULL_ACCESS_HOMESERVERS: matrix.${DOMAIN}

    expose:
      - "8080"

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    networks:
      net:
        ipv4_address: 172.22.0.36

  element-call:
    # Same pinning story as livekit: no semver tag in the registry, so the
    # digest is the pin and the label names the release (v0.28.1).
    image: ghcr.io/element-hq/element-call@sha256:a6118b789b39130ec29227e8c9e7b68d192213d9131c1cc30d9f9ab2609864a4
    container_name: element-call
    restart: unless-stopped

    mem_limit: 64m
    memswap_limit: 64m

    environment:
      TZ: ${TIMEZONE}

    volumes:
      # Only the homeserver config: the SFU comes from the homeserver's
      # matrix_rtc block, so this file never names LiveKit.
      - ${DATA_DIR}/call/element-call/config.json:/app/config.json:ro

    expose:
      - "8080"

    # Static nginx: it only ever writes to /tmp and its caches. A read-only
    # rootfs keeps a compromised call page from persisting anything.
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run

    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    networks:
      net:
        ipv4_address: 172.22.0.37

networks:
  net:
    external: true
