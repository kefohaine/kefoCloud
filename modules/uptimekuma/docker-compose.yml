services:
  kuma:
    image: louislam/uptime-kuma:2
    container_name: uptimekuma
    restart: unless-stopped

    # Hard RAM cap (no container swap) — survives recreates, unlike `docker update`.
    mem_limit: 512m
    memswap_limit: 512m

    # Kuma 2.5+ boots into a "Setup Database" web wizard unless it can read
    # db-config.json OR find an existing kuma.db, and it does NOT touch the
    # SQLite file until that resolves: the container serves its port and looks
    # healthy while kuma.db stays 0 bytes with no tables. This env var sets
    # needSetup=false at boot, so Kuma creates db-config.json + the schema by
    # itself and the installer's seed has tables to insert into (2026-09-25:
    # kuma_seed failed with "no such table: docker_host/monitor/group").
    environment:
      UPTIME_KUMA_DB_TYPE: sqlite

    expose:
      - "3001"

    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:3001/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

    volumes:
      - ${DATA_DIR}/kuma/data:/app/data:rw
      # Read-only docker socket so Kuma can monitor running containers.
      # Risk: compromised Kuma container = host root. Kuma is a single-user
      # dashboard behind Tailscale + Cloudflare; acceptable for this setup.
      - /var/run/docker.sock:/var/run/docker.sock:ro

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    # Pin the bridge IP — modules/vhosts/Caddyfile hardcodes
    # 172.22.0.6:3001 for the uptimekuma upstream.
    networks:
      net:
        ipv4_address: 172.22.0.6

networks:
  net:
    external: true
