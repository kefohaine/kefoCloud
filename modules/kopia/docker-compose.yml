services:
  kopia:
    image: kopia/kopia:0.19.0
    container_name: kopia
    restart: unless-stopped

    mem_limit: 512m
    memswap_limit: 512m

    environment:
      TZ: ${TIMEZONE}
      KOPIA_PASSWORD: ${KOPIA_PASSWORD}
      KOPIA_SERVER_USERNAME: ${KOPIA_SERVER_USERNAME}
      KOPIA_SERVER_PASSWORD: ${KOPIA_SERVER_PASSWORD}
      KOPIA_CHECK_FOR_UPDATES: "false"

    # The server needs a repository before it can serve one: create it on
    # first start (idempotent — an existing filesystem repository is left
    # alone), then run the web UI/API. `--insecure` keeps the listener on plain
    # HTTP because TLS terminates at the Caddy edge, which is the only route in.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        kopia repository status --config-file=/data/config/repository.config >/dev/null 2>&1 ||
        kopia repository create filesystem --path=/data/repository --config-file=/data/config/repository.config;
        exec kopia server start
        --config-file=/data/config/repository.config
        --address=0.0.0.0:51515
        --insecure
        --server-username="$${KOPIA_SERVER_USERNAME}"
        --server-password="$${KOPIA_SERVER_PASSWORD}"

    volumes:
      # $DATA_DIR/kopia/{repository,config} — the backup repository and kopia's
      # own client config. Both are instance state and never tracked.
      - ${DATA_DIR}/kopia:/data
      # Every module's data dir plus the rendered config, read-only: the UI
      # picks which of these sources a snapshot policy covers.
      - ${DATA_DIR}:/source:ro

    expose:
      - "51515"

    healthcheck:
      test: ["CMD-SHELL", "kopia repository status --config-file=/data/config/repository.config >/dev/null || exit 1"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 30s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    networks:
      net:
        ipv4_address: 172.22.0.31

networks:
  net:
    external: true
