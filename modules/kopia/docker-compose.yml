services:
  kopia:
    image: kopia/kopia:0.19.0
    hostname: kopia
    container_name: kopia
    restart: unless-stopped

    mem_limit: 512m
    memswap_limit: 512m

    environment:
      TZ: ${TIMEZONE}
      # The one secret this module owns: it opens the repository, which lives
      # off this host. There is no server account — no UI, no API.
      KOPIA_PASSWORD: ${KOPIA_PASSWORD}
      KOPIA_CHECK_FOR_UPDATES: "false"

    # Idle client, nothing else. No `server start`, no published port, no HTTP
    # listener: the container exists so `kopia snapshot create` has a kopia
    # binary with the repository config mounted, and kopia-snapshot.timer drives
    # it through `docker exec`. Health is NOT tied to the off-box disk: a slept
    # laptop would otherwise mark the container unhealthy every night, so there
    # is no healthcheck — a failed snapshot is the real signal and the timer
    # records it.
    entrypoint: ["/bin/sh", "-c", "exec sleep infinity"]

    volumes:
      # $DATA_DIR/kopia — kopia's client config (which points at the remote
      # repository) plus the ssh/ key and known_hosts the SFTP transport uses.
      # The repository itself is NOT here: it is on the off-box disk.
      - ${DATA_DIR}/kopia:/data
      # Every module's data dir plus the rendered config, read-only: this is
      # what a snapshot covers. The writable mount above is the only exclusion —
      # `make kopia-init` writes it into the source's ignore policy, so the
      # backup never contains itself.
      - ${DATA_DIR}:/source:ro

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    networks:
      net:
        ipv4_address: 172.22.0.31

networks:
  net:
    external: true
