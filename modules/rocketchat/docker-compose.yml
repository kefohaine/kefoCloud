services:
  rocketchat-db:
    image: mongo:8.0
    container_name: rocketchat-db
    restart: unless-stopped

    # Hard RAM cap (no container swap) — survives recreates, unlike `docker update`.
    mem_limit: 512m
    memswap_limit: 512m

    # Rocket.Chat needs MongoDB as a single-node replica set (it uses
    # transactions and the oplog), so `--replSet rs0` is mandatory; the member
    # is initiated once by the rocketchat-db-init service below. No auth: the
    # database publishes no port and is only reachable from the `net` bridge.
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all", "--oplogSize", "256"]

    volumes:
      - ${DATA_DIR}/rocketchat/db:/data/db

    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.adminCommand({ping:1}).ok' | grep -q 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    networks:
      net:
        ipv4_address: 172.22.0.29

  # One-shot: initiate the replica set once mongod listens on the bridge, then
  # exit. It CANNOT be a /docker-entrypoint-initdb.d script — the image runs
  # those against a mongod bound to 127.0.0.1, where the member host
  # `rocketchat-db:27017` does not map to the node (NodeNotFound).
  rocketchat-db-init:
    image: mongo:8.0
    container_name: rocketchat-db-init
    restart: "no"
    depends_on:
      - rocketchat-db
    entrypoint: ["bash", "-c"]
    command:
      - |
        until mongosh --host rocketchat-db:27017 --quiet --eval 'db.adminCommand({ping:1}).ok' >/dev/null 2>&1; do sleep 2; done
        mongosh --host rocketchat-db:27017 --quiet --eval 'try { rs.status() } catch (e) { rs.initiate({_id:"rs0", members:[{_id:0, host:"rocketchat-db:27017"}]}) }'
    networks:
      net:
        ipv4_address: 172.22.0.30

  rocketchat:
    image: rocketchat/rocket.chat:7.10.0
    container_name: rocketchat
    restart: unless-stopped
    depends_on:
      rocketchat-db:
        condition: service_healthy

    # Node + its build tooling at boot; 1g is the floor.
    mem_limit: 1g
    memswap_limit: 1g

    environment:
      # Service names, not pinned IPs: the replica-set member advertises
      # `rocketchat-db:27017`, and the client must use the same spelling.
      MONGO_URL: mongodb://rocketchat-db:27017/rocketchat?replicaSet=rs0
      MONGO_OPLOG_URL: mongodb://rocketchat-db:27017/local?replicaSet=rs0
      ROOT_URL: https://chat.${DOMAIN}
      PORT: "3000"
      DEPLOY_METHOD: docker

    # Uploads live outside the container; the MongoDB data is the other half.
    volumes:
      - ${DATA_DIR}/rocketchat/uploads:/app/uploads

    expose:
      - "3000"

    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/info | grep -q version"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    # Pinned bridge IP — modules/caddy/vhosts/chat.caddy proxies it.
    networks:
      net:
        ipv4_address: 172.22.0.28

networks:
  net:
    external: true
