version: 1.0.0
title: "Review DNS, TLS, mail and reverse-proxy"
description: "Read-only review of the public/tailnet ingress: Cloudflare records, Caddy vhosts, TLS, mail delivery, and the reverse-proxy."
instructions: |
  Read-only. Do not change DNS, firewall, TLS, or Caddy config (AGENTS safety
  rule 10). Never print secrets (CF_API_TOKEN, cert keys, mail credentials).
  Verify with read-only probes only; report drift and fixes for operator review.
author:
  contact: "{{GITHUB_USER}}"
extensions:
  - type: builtin
    name: developer
activities:
  - "Verify Cloudflare A records and proxied vs DNS-only mode per hostname"
  - "Check Caddy vhosts and the tailnet-only matcher"
  - "Check TLS issuer/dates per vhost from the host"
  - "Check mail SPF/DKIM/DMARC/PTR and postfix serving"
  - "Report discrepancies with docs/GUIDE.md 'Domains and access model'"
parameters:
  - key: focus
    input_type: string
    requirement: optional
    description: "Optional focus: dns, tls, mail, caddy, or all"
    default: "all"
prompt: |
  Review the ingress and mail stack, focus: {{ focus }}.

  Cross-check docs/GUIDE.md "Domains and access model" and the service-reference
  table against the live config.

  Inspect:
  - services/caddy/Caddyfile and services/caddy/vhosts/*.caddy
  - services/mailserver/docker-compose.yml and its healthchecks
  - make smoke output for vhost/edge behavior

  Verify (read-only, from the host):
  - per-hostname Cloudflare mode (proxied vs DNS-only) and A records
  - TLS issuer/dates via openssl s_client -servername <host> from the host
    (not through Cloudflare — the origin cert should be Let's Encrypt)
  - mail: dig MX/TXT (SPF/DMARC/DKIM), PTR via dig -x, and the postfix banner

  Return:
  - a per-hostname table: DNS mode, reachability, TLS issuer, status
  - any drift from the docs
  - mail deliverability blockers (e.g. missing PTR)
  - concrete fixes and their verification commands
