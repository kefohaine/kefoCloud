version: 1.0.0
title: "Verify backups and restore"
description: "Read-only audit of the backup and restore posture: artifacts, schedules, off-site copies, and restore procedure."
instructions: |
  Read-only. Do not create, delete, restore, or rotate anything. Never read or
  print secrets or operator data. Follow docs/AGENTS.md. Report gaps and a
  prioritized remediation list; do not apply fixes.
author:
  contact: "{{GITHUB_USER}}"
extensions:
  - type: builtin
    name: developer
activities:
  - "Enumerate backup artifacts and schedules"
  - "Check the Kopia repository, its snapshots and retention policies"
  - "Check make backup / make kopia-* recipes and what the snapshot covers"
  - "Assess restore procedures and off-site/DR coverage"
  - "Report gaps and a prioritized remediation list"
parameters:
  - key: focus
    input_type: string
    requirement: optional
    description: "Optional scope: chat, vault, kuma, mail, kopia, or all"
    default: "all"
  - key: GITHUB_USER
    input_type: string
    requirement: optional
    description: "GitHub account recorded as the recipe author contact"
    default: ""
prompt: |
  Audit the backup and restore posture, scope: {{ focus }}.

  Read docs/MANUAL.md (backup gotchas, storage row, protected resources) and
  the repository's Issues tab (open backup/restore items).

  Inspect:
  - the Makefile `backup` and `kopia-*` recipes and scripts/modules/kopia-admin.sh
  - the kopia container: repository status, snapshot list, retention policies,
    and what the /source mount actually contains
  - what is and is not covered: matrix (PostgreSQL + media), vaultwarden data,
    kuma db, mailserver Maildirs/config, ocis, pages, rendered config, secrets
  - whether there is an off-box copy of the repository beyond this host (Kopia
    `repository sync-to` target, or a second copy on another device)

  Return:
Return:
  - an inventory of what is backed up, where, and how often
  - what is NOT covered
  - restore-procedure gaps
  - prioritized fixes (flag operator-approval items, e.g. choosing the file-backup target)
